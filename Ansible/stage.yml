  hosts:
    - proxmoxs
  roles:
    - self-hosted/repositories/proxmox
    - repositories/proxmox
    - self-hosted/repositories/debian
    - repositories/date
    - repositories/debian
    - repositories/upgrade/manual
    - services/system/upgrade/unattended
    - services/monitoring/snmpd
    - services/monitoring/monit
    - security/hips/fail2ban/init

- name: config debians servers
  hosts:
    - servers
  roles:
    - self-hosted/repositories/debian
    - repositories/date
    - repositories/debian
    - repositories/upgrade/manual
    - system/user/sudo
    - services/system/upgrade/unattended
    - services/send-only/postfix
    - services/monitoring/snmpd
    - services/monitoring/monit
    - security/cryptographic/ssh
    - security/hips/fail2ban/init
    - security/system/sysctl/hosts
    - security/firewall/iptables/hosts
    - security/firewall/iptables/snmpd
    - notification/upgrade/unattended
