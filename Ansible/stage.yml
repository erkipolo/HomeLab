---

- name: config proxmoxs servers
  hosts:
    - proxmoxs
  roles:
    - self-hosted/repositories/proxmox
    - repositories/proxmox
    - self-hosted/repositories/debian
    - repositories/date
    - repositories/debian
    - repositories/upgrade/manual
    - security/upgrade/unattended
    - security/hips/fail2ban/init
    - security/monitoring/snmpd
    - security/monitoring/monit

- name: config debians servers
  hosts:
    - servers
  roles:
    - self-hosted/repositories/debian
    - repositories/date
    - repositories/debian
    - repositories/upgrade/manual
    - system/user/sudo
    - security/cryptographic/ssh
    - security/upgrade/unattended
    - security/hips/fail2ban/init
    - security/monitoring/snmpd
    - security/monitoring/monit
    - security/system/sysctl/hosts
    - security/firewall/iptables/init/hosts
    - security/firewall/iptables/snmpd
    - services/send-only/postfix/enable
    - notification/upgrade/unattended
    - notification/hips/fail2ban
    - notification/monitoring/monit

