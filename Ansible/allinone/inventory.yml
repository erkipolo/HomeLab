all:
  vars:
    ADMIN_CIDR_1: '192.168.56.1/32'
    ADMIN_CIDR_2: '192.168.56.1/32'
    ADMIN_CIDR_3: '192.168.56.1/32'
    EMAIL_NOTIFICATION: 'admin1@homelab.cu'
    SNMP_COMMUNITY: 'homelab'
    SNMP_CIDR_1: '192.168.56.1/32'
    SNMP_CIDR_2: '192.168.56.1/32'
    SNMP_CIDR_3: '192.168.56.1/32'
  children:
    debian:
      vars:
        debian_self_hosted_find:   '^192\.168\.56\.1 deb'
        debian_self_hosted_hosts:  '192.168.56.1 deb.debian.org security.debian.org'
      children:
        server:
          vars:
            SUDO_USER_NAME: 'admin1'
            SUDO_USER_PASS: '~/.ssh/homelab_sudo_user_pass.txt'
            SUDO_USER_PUB_KEY: '~/.ssh/homelab_key.pub'
          children:
            lamp:
              children:
                nextcloud:
                  vars:
                    NEXTCLOUD_ADMIN_USER: 'admin'
                    NEXTCLOUD_ADMIN_PASS: 'admin'
                    NEXTCLOUD_DATABASE_USER: 'nextcloud'
                    NEXTCLOUD_DATABASE_PASS: 'nextcloud'
                  hosts:
                    ct00:
                      ansible_host: 192.168.56.10
        proxmox:
          vars:
            proxmox_self_hosted_find:  '^192\.168\.56\.1 dow'
            proxmox_self_hosted_hosts: '192.168.56.1 download.proxmox.com'
          hosts:
            pve:
              ansible_host: 192.168.56.9
