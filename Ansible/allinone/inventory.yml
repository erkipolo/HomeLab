all:
  vars:
    ADMIN_CIDR_1: '192.168.56.1/32'
    ADMIN_CIDR_2: '192.168.56.1/32'
    ADMIN_CIDR_3: '192.168.56.1/32'
    SNMP_CIDR_1: '192.168.56.1/32'
    SNMP_CIDR_2: '192.168.56.1/32'
    SNMP_CIDR_3: '192.168.56.1/32'
  hosts:
    pve:  # Proxmox Virtual Enviroment
      ansible_host: 192.168.56.9
    ct00: # CT without internet
      ansible_host: 192.168.56.10
    ct01: # CT with internet
      ansible_host: 192.168.56.11
    ct02: # CT nextcloud without internet
      ansible_host: 192.168.56.12
  children:
    selfhosted:
      children:
        debian:
          vars:
            debian_self_hosted_find:   '^192\.168\.56\.1 deb'
            debian_self_hosted_hosts:  '192.168.56.1 deb.debian.org security.debian.org'
          hosts:
            ct02:
          children:
            proxmox:
              vars:
                proxmox_self_hosted_find:  '^192\.168\.56\.1 dow'
                proxmox_self_hosted_hosts: '192.168.56.1 download.proxmox.com'
              hosts:
                pve:
    debian:
      vars:
        SUDO_USER_NAME: 'admin'
        SUDO_USER_PASS: '~/.ssh/homelab_sudo_user_pass.txt'
        SUDO_USER_PUB_KEY: '~/.ssh/homelab_key.pub'
        SNMP_CONTACT: 'monitor@homelab.cu'
        SNMP_COMMUNITY: 'homelab'
      hosts:
      children:
        proxmox:
          hosts:
            pve:
        server:
          vars:
            EMAIL_NOTIFICATION: 'admin@homelab.cu'
          hosts:
          children:
            web:
              vars:
              hosts:
            database:
              vars:
              hosts:
            lamp:
              vars:
              hosts:
              children:
                nextcloud:
                  vars:
                    NEXTCLOUD_HOST_ALIAS: 'nextcloud'
                    NEXTCLOUD_ADMIN_USER: 'admin'
                    NEXTCLOUD_ADMIN_PASS: 'admin'
                    NEXTCLOUD_DATABASE_USER: 'nextcloud'
                    NEXTCLOUD_DATABASE_PASS: 'nextcloud'
                  hosts:
                    ct02:
                wordpress:
                  vars:
                    WORDPRESS_HOST_ALIAS: 'wordpress'
                    WORDPRESS_ADMIN_USER: 'admin'
                    WORDPRESS_ADMIN_PASS: 'admin'
                    WORDPRESS_DATABASE_USER: 'wordpress'
                    WORDPRESS_DATABASE_PASS: 'wordpress'
                  hosts:
                zabbix:
                  vars:
                    ZABBIX_HOST_ALIAS: 'zabbix'
                    ZABBIX_DATABASE_USER: 'zabbix'
                    ZABBIX_DATABASE_PASS: 'zabbix'
                  hosts:

