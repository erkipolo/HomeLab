---
#- name: Create a new database with name 'Gitea'
#  ansible.mysql.mysql_db:
#    name: gitea
#    state: present
#    login_unix_socket: /run/mysqld/mysqld.sock

- name: Create Gitea mariadb
  ansible.builtin.mysql_db:
    name: "gitea"
    state: present

- name: Create Gitea user for Gitea mariadb
  ansible.builtin.mysql_user:
    name: "{{ GITEA_DATABASE_USER }}"
    password: '{{ GITEA_DATABASE_PASS }}'
    priv: "gitea.*:ALL"
    host: 'localhost'
    state: present

- name: Start Psiphond
  ansible.builtin.systemd_service:
    name: psiphond.service
    masked: no
    enabled: true
    state: started

- name: Check if Gitea Keyring archive are downloaded
  ansible.builtin.stat:
    path: /etc/apt/trusted.gpg.d/morph027-gitea.asc
  register: file_check

- name: Download Gitea Keyring archive
  ansible.builtin.get_url:
    url: "https://packaging.gitlab.io/gitea/gpg.key"
    dest: "/etc/apt/trusted.gpg.d/morph027-gitea.asc"
    owner: "root"
    group: "root"
    mode: '0755'
    use_proxy: yes
  environment: "{{ proxy_env }}"
  when: file_check.stat.exists == false

- name: Add gitea repositories
  ansible.builtin.deb822_repository:
    name: morph027-gitea
    types: deb
    uris: "https://packaging.gitlab.io/gitea/"
    suites:
      - gitea
    components:
      - main
    architectures: amd64
    signed_by: /etc/apt/trusted.gpg.d/morph027-gitea.asc
    state: present

- name: Add gitea repository proxy
  ansible.builtin.lineinfile:
    dest: /etc/apt/apt.conf
    regexp: '^acquire\:\:https\:\:proxy\:\:packaging\.gitlab\.io'
    line: 'acquire::https::proxy::packaging.gitlab.io    "http://127.0.0.1:8081/";'

- name: Install gitea
  ansible.builtin.apt:
    name:
      - gitea
      - morph027-keyring
    state: latest
    update_cache: yes
  environment: "{{ proxy_env }}"

- name: Start Gitea
  ansible.builtin.systemd_service:
    name: gitea.service
    masked: no
    enabled: true
    state: started

- name: Check if Gitea Keyring archive are downloaded
  ansible.builtin.stat:
    path: /etc/apt/apt.conf.d/52unattended-upgrades
  register: file_check

- name: Setting gitea Unattended Upgrade
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52gitea-upgrades
    owner: root
    group: root
    mode: '0644'
    content: |
      Unattended-Upgrade::Allowed-Origins {"morph027:gitea";};
  notify: restart_unattended
  when: file_check.stat.exists == true

