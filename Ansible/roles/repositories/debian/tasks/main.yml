# Config Debian Repositories
- name: Delete obsolete config file
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list

- name: Add debian main repositories
  tags: Repositories
  ansible.builtin.deb822_repository:
    name: debian
    types: deb
    uris: http://deb.debian.org/debian
    suites:
      - trixie
      - trixie-updates
    components:
      - main
      - contrib
    architectures: amd64
    signed_by: /usr/share/keyrings/debian-archive-keyring.gpg
    state: present

- name: Add debian security repositories
  tags: Repositories
  ansible.builtin.deb822_repository:
    name: security
    types: deb
    uris: http://security.debian.org/debian-security
    suites:
      - trixie-security
    components:
      - main
      - contrib
    architectures: amd64
    signed_by: /usr/share/keyrings/debian-archive-keyring.gpg
    state: present
