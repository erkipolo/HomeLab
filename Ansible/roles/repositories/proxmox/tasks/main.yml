# Config Debian Repositories
- name: Delete enterprise proxmox config file
  tags: Repositories
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/pve-enterprise.sources

- name: Add proxmox main repositories
  tags: Repositories
  ansible.builtin.deb822_repository:
    name: proxmox
    types: deb
    uris: http://download.proxmox.com/debian/pve
    suites:
      - trixie
    components:
      - pve-no-subscription
    architectures: amd64
    signed_by: /usr/share/keyrings/proxmox-archive-keyring.gpg
    state: present

- name: Add proxmox ceph repositories
  tags: Repositories
  ansible.builtin.deb822_repository:
    name: ceph
    types: deb
    uris: http://download.proxmox.com/debian/ceph-squid
    suites:
      - trixie
    components:
      - no-subscription
    architectures: amd64
    signed_by: /usr/share/keyrings/proxmox-archive-keyring.gpg
    state: present
