- name: Setting unattended upgrades email notification
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/53unattended-notification-local
    owner: root
    group: root
    mode: '0644'
    content: |
      Unattended-Upgrade::Mail "{{ EMAIL_NOTIFICATION }}";
      Unattended-Upgrade::MailReport "only-on-error";
  notify: restart_unattended
