- name: Install sudo
  tags: SudoUser
  ansible.builtin.apt:
    name:
      - sudo
    state: latest

- name: Create new user
  tags: SudoUser
  ansible.builtin.user:
    name: "{{ SUDO_USER_NAME }}"
    password: "{{ lookup('file', SUDO_USER_PASS) }}"
    state: present
    createhome: yes
    shell: /bin/bash

- name: Add new user public key 
  tags: SudoUser
  ansible.builtin.authorized_key:
    user: "{{ SUDO_USER_NAME }}"
    key: "{{ lookup('file', SUDO_USER_PUB_KEY) }}"
    state: present

- name: Add new user to sudo group
  tags: SudoUser
  ansible.builtin.blockinfile:
    path: /etc/sudoers.d/{{ SUDO_USER_NAME }}
    create: yes
    block: |
      {{ SUDO_USER_NAME}} ALL=(ALL:ALL) ALL
