          - zabbix-sql-scripts
          - zabbix-server-mysql
          - zabbix-frontend-php
        state: latest
        update_cache: yes

    - name: Create zabbix mariadb
      ansible.builtin.mysql_db:
        name: "zabbix"
        state: present
      notify: import_schema

    - name: Create zabbix user for zabbix mariadb
      ansible.builtin.mysql_user:
        name: "{{ ZABBIX_DATABASE_USER }}"
        password: '{{ ZABBIX_DATABASE_PASS }}'
        priv: "zabbix.*:ALL"
        host: 'localhost'
        state: present

    - name: Setting mariadb user
      ansible.builtin.lineinfile:
        dest: /etc/zabbix/zabbix_server.conf
        regexp: "^DBUser="
        line: 'DBUser={{ ZABBIX_DATABASE_USER }}'
      notify: restart_zabbix

    - name: Setting mariadb password
      ansible.builtin.lineinfile:
        dest: /etc/zabbix/zabbix_server.conf
        regexp: "^# DBPassword="
        line: 'DBPassword={{ ZABBIX_DATABASE_PASS }}'
      notify: restart_zabbix

    - name: Create zabbix site configuration
      ansible.builtin.copy:
        dest: /etc/apache2/sites-available/zabbix.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          <VirtualHost *:443>
            DocumentRoot  "/usr/share/zabbix"
            ServerName    {{ ansible_fqdn }}
            ServerAlias   {{ ZABBIX_HOST_ALIAS }}.{{ ansible_domain }}
            ErrorLog ${APACHE_LOG_DIR}/error.log
            CustomLog ${APACHE_LOG_DIR}/access.log combined
            SSLEngine on
            SSLCertificateFile      /etc/ssl/certs/ssl-cert-snakeoil.pem
            SSLCertificateKeyFile   /etc/ssl/private/ssl-cert-snakeoil.key
            <FilesMatch "\.(?:cgi|shtml|phtml|php)$">
              SSLOptions +StdEnvVars
            </FilesMatch>
            <Directory /usr/lib/cgi-bin>
              SSLOptions +StdEnvVars
            </Directory>
            <Directory "/usr/share/zabbix">
              Options FollowSymLinks
              AllowOverride None
              Order allow,deny
              Allow from all
              <IfModule mod_php.c>
                php_value max_execution_time 300
                php_value memory_limit 128M
                php_value post_max_size 16M
                php_value upload_max_filesize 2M
                php_value max_input_time 300
                php_value max_input_vars 10000
                php_value always_populate_raw_post_data -1
              </IfModule>
              <IfModule mod_php7.c>
                php_value max_execution_time 300
                php_value memory_limit 128M
                php_value post_max_size 16M
                php_value upload_max_filesize 2M
                php_value max_input_time 300
                php_value max_input_vars 10000
                php_value always_populate_raw_post_data -1
              </IfModule>
            </Directory>
            <Directory "/usr/share/zabbix/conf">
              Order deny,allow
              Deny from all
              <files *.php>
                Order deny,allow
                Deny from all
              </files>
            </Directory>
            <Directory "/usr/share/zabbix/app">
              Order deny,allow
              Deny from all
              <files *.php>
                Order deny,allow
                Deny from all
              </files>
            </Directory>
            <Directory "/usr/share/zabbix/include">
              Order deny,allow
              Deny from all
              <files *.php>
                Order deny,allow
                Deny from all
              </files>
            </Directory>
            <Directory "/usr/share/zabbix/local">
              Order deny,allow
              Deny from all
              <files *.php>
                Order deny,allow
                Deny from all
              </files>
            </Directory>
            <Directory "/usr/share/zabbix/vendor">
              Order deny,allow
              Deny from all
              <files *.php>
                Order deny,allow
                Deny from all
              </files>
            </Directory>
          </VirtualHost>
      notify: restart_apache

    - name: Enable zabbix SSL site
      ansible.builtin.file:
        src: /etc/apache2/sites-available/zabbix.conf
        dest: /etc/apache2/sites-enabled/zabbix.conf
        state: link
      notify: restart_apache

  handlers:
    - name: import_schema
      ansible.builtin.shell: |
        zcat /usr/share/zabbix-sql-scripts/mysql/server.sql.gz | mariadb --default-character-set=utf8mb4 -u {{ ZABBIX_DATABASE_USER }} -p'{{ ZABBIX_DATABASE_PASS }}' zabbix

    - name: restart_zabbix
      ansible.builtin.systemd_service:
        name: zabbix-server
        masked: no
        enabled: true
        state: restarted

    - name: restart_apache
      ansible.builtin.systemd_service:
        name: apache2
        masked: no
        enabled: true
        state: restarted
