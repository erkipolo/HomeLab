- name: debian server php common dependencies
  tags: lamp
  hosts:
    - lamp
  tasks:
    - name: Install PHP common dependencies
      ansible.builtin.apt:
        name:
          - php-cli
          - php-zip
          - php-xml
          - php-curl
          - php-common
          - php-mbstring
        state: latest

    - name: Setting PHP timezone
      ansible.builtin.lineinfile:
        dest: '{{ item }}'
        regexp: '^;date.timezone ='
        line: "date.timezone = America/Havana"
      loop:
        - '/etc/php/8.4/apache2/php.ini'
        - '/etc/php/8.4/cli/php.ini'
        - '/etc/php/8.4/fpm/php.ini'
      notify: restart_php

    - name: Increase PHP memory limit
      ansible.builtin.lineinfile:
        dest: '{{ item }}'
        regexp: '^memory_limit ='
        line: "memory_limit = 512M"
      loop:
        - '/etc/php/8.4/apache2/php.ini'
        - '/etc/php/8.4/cli/php.ini'
        - '/etc/php/8.4/fpm/php.ini'
      notify: restart_php

    - name: Increase PHP execution time limit
      ansible.builtin.lineinfile:
        dest: '{{ item }}'
        regexp: '^max_execution_time ='
        line: "max_execution_time = 360"
      loop:
        - '/etc/php/8.4/apache2/php.ini'
        - '/etc/php/8.4/cli/php.ini'
        - '/etc/php/8.4/fpm/php.ini'
      notify: restart_php

    - name: Increase PHP filesize limit to upload
      ansible.builtin.lineinfile:
        dest: '{{ item }}'
        regexp: '^upload_max_filesize ='
        line: "upload_max_filesize = 200M"
      loop:
        - '/etc/php/8.4/apache2/php.ini'
        - '/etc/php/8.4/cli/php.ini'
        - '/etc/php/8.4/fpm/php.ini'
      notify: restart_php

    - name: Increase PHP size of POST data limit
      ansible.builtin.lineinfile:
        dest: '{{ item }}'
        regexp: '^post_max_size ='
        line: "post_max_size = 200M"
      loop:
        - '/etc/php/8.4/apache2/php.ini'
        - '/etc/php/8.4/cli/php.ini'
        - '/etc/php/8.4/fpm/php.ini'
      notify: restart_php

    - name: Increase PHP input time limit
      ansible.builtin.lineinfile:
        dest: '{{ item }}'
        regexp: '^max_input_time ='
        line: "max_input_time = 300"
      loop:
        - '/etc/php/8.4/apache2/php.ini'
        - '/etc/php/8.4/cli/php.ini'
        - '/etc/php/8.4/fpm/php.ini'
      notify: restart_php

    - name: Enable PHP opcache
      ansible.builtin.lineinfile:
        dest: '{{ item }}'
        regexp: '^;opcache.enable='
        line: "opcache.enable=1"
      loop:
        - '/etc/php/8.4/apache2/php.ini'
        - '/etc/php/8.4/cli/php.ini'
        - '/etc/php/8.4/fpm/php.ini'
      notify: restart_php

    - name: Increase PHP amount of memory for interned strings for opcache
      ansible.builtin.lineinfile:
        dest: '{{ item }}'
        regexp: '^;opcache.interned_strings_buffer='
        line: "opcache.interned_strings_buffer=16"
      loop:
        - '/etc/php/8.4/apache2/php.ini'
        - '/etc/php/8.4/cli/php.ini'
        - '/etc/php/8.4/fpm/php.ini'
      notify: restart_php

    - name: Setting PHP maximum number of keys for opcache
      ansible.builtin.lineinfile:
        dest: '{{ item }}'
        regexp: '^;opcache.max_accelerated_files='
        line: "opcache.max_accelerated_files=10000"
      loop:
        - '/etc/php/8.4/apache2/php.ini'
        - '/etc/php/8.4/cli/php.ini'
        - '/etc/php/8.4/fpm/php.ini'
      notify: restart_php

    - name: Setting PHP opcache shared memory
      ansible.builtin.lineinfile:
        dest: '{{ item }}'
        regexp: '^;opcache.memory_consumption='
        line: "opcache.memory_consumption=128"
      loop:
        - '/etc/php/8.4/apache2/php.ini'
        - '/etc/php/8.4/cli/php.ini'
        - '/etc/php/8.4/fpm/php.ini'
      notify: restart_php

    - name: Setting PHP opcache how often to check file for changes
      ansible.builtin.lineinfile:
        dest: '{{ item }}'
        regexp: '^;opcache.revalidate_freq='
        line: "opcache.revalidate_freq=1"
      loop:
        - '/etc/php/8.4/apache2/php.ini'
        - '/etc/php/8.4/cli/php.ini'
        - '/etc/php/8.4/fpm/php.ini'
      notify: restart_php

    - name: Enable PHP opcache comments
      ansible.builtin.lineinfile:
        dest: '{{ item }}'
        regexp: '^;opcache.save_comments='
        line: "opcache.save_comments=1"
      loop:
        - '/etc/php/8.4/apache2/php.ini'
        - '/etc/php/8.4/cli/php.ini'
        - '/etc/php/8.4/fpm/php.ini'
      notify: restart_php

  handlers:
    - name: restart_php
      ansible.builtin.systemd_service:
        name: php8.4-fpm
        masked: no
        enabled: true
        state: restarted

- name: debian server nextcloud install
  tags: nextcloud
  hosts:
    - nextcloud
  tasks:
    - name: Check if NextCloud archive are downloaded
      delegate_to: localhost
      ansible.builtin.stat:
        path: /home/sysadmin/Documentos/GitHub/HomeLab/Ansible/files/nextcloud-32.0.2.tar.gz
      register: file_check

    - name: Download NextCloud archive
      delegate_to: localhost
      get_url:
        url: "https://download.nextcloud.com/server/releases/nextcloud-32.0.2.tar.gz"
        dest: "/home/sysadmin/Documentos/GitHub/HomeLab/Ansible/files/nextcloud-32.0.2.tar.gz"
        owner: "sysadmin"
        group: "sysadmin"
        mode: '0755'
      when: file_check.stat.exists == false

    - name: Check if nextcloud are installed
      ansible.builtin.stat:
        path: /var/www/nextcloud/config/config.php
      register: file_check

    - name: upload nextcloud archive
      ansible.builtin.copy:
        src: nextcloud-32.0.2.tar.gz
        dest: /tmp/nextcloud.tar.gz
      when: file_check.stat.exists == false

    - name: Extract nextcloud archive
      ansible.builtin.unarchive:
        src: "/tmp/nextcloud.tar.gz"
        dest: "/tmp/"
        remote_src: yes
      when: file_check.stat.exists == false

    - name: Copy nextcloud folder to /var/www
      ansible.builtin.copy:
        src: /tmp/nextcloud/
        dest: /var/www/nextcloud/
        remote_src: true
        owner: www-data
        group: www-data
        mode: '0755'
      when: file_check.stat.exists == false

    - name: Create data directory for the nextcloud
      ansible.builtin.file:
        path: /var/www/nextcloud/data
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'
      when: file_check.stat.exists == false

    - name: Removing temporal files
      ansible.builtin.file:
          path: "{{ item }}"
          state: absent
      loop:
         - /tmp/nextcloud.tar.gz
         - /tmp/nextcloud

    - name: Create nextcloud database
      ansible.builtin.mysql_db:
        name: "nextcloud"
        state: present

    - name: Create nextcloud user for nextcloud database
      ansible.builtin.mysql_user:
        name: "{{ NEXTCLOUD_DATABASE_USER }}"
        password: '{{ NEXTCLOUD_DATABASE_PASS }}'
        priv: "nextcloud.*:ALL"
        host: 'localhost'
        state: present

    - name: Install nextcloud PHP dependencies
      ansible.builtin.apt:
        name:
          - php-gd
          - php-gmp
          - php-apcu
          - php-intl
          - php-ldap
          - php-bcmath
          - php-zip
          - php-imagick
        state: latest

    - name: Install nextcloud software dependencies
      ansible.builtin.apt:
        name:
          - zip
          - unzip
          - imagemagick-7.q16
        state: latest

    - name: Enable CLI to PHP module APCU
      ansible.builtin.lineinfile:
        dest: /etc/php/8.4/mods-available/apcu.ini
        regexp: '^apc.enable_cli='
        line: "apc.enable_cli=1"
      notify: restart_php

    - name: Enable PHP module for fpm
      ansible.builtin.file:
        src: /etc/php/8.4/mods-available/{{ item }}.ini
        dest: /etc/php/8.4/fpm/conf.d/20-{{ item }}.ini
        state: link
      loop:
        - gmp
        - apcu
        - intl
        - bcmath
        - zip
        - imagick
      notify: restart_php

    - name: Enable PHP module for apache
      ansible.builtin.file:
        src: /etc/php/8.4/mods-available/{{ item }}.ini
        dest: /etc/php/8.4/apache2/conf.d/20-{{ item }}.ini
        state: link
      loop:
        - gmp
        - apcu
        - intl
        - bcmath
        - zip
        - imagick
      notify: restart_php

    - name: Enable PHP module for cli
      ansible.builtin.file:
        src: /etc/php/8.4/mods-available/{{ item }}.ini
        dest: /etc/php/8.4/cli/conf.d/20-{{ item }}.ini
        state: link
      loop:
        - gmp
        - apcu
        - intl
        - bcmath
        - zip
        - imagick
      notify: restart_php

    - name: Give execution permissions to OCC
      ansible.builtin.file:
        path: /var/www/nextcloud/occ
        owner: www-data
        group: www-data
        mode: '0755'
      when: file_check.stat.exists == false

    - name: Install nextcloud with OCC
      ansible.builtin.shell: |
        sudo -u www-data \
        php /var/www/nextcloud/occ \
        maintenance:install \
        --admin-user='{{ NEXTCLOUD_ADMIN_USER }}' \
        --admin-pass='{{ NEXTCLOUD_ADMIN_PASS }}' \
        --data-dir='/var/www/nextcloud/data' \
        --database='mysql' \
        --database-name='nextcloud' \
        --database-user='{{ NEXTCLOUD_DATABASE_USER }}' \
        --database-pass='{{ NEXTCLOUD_DATABASE_PASS }}' \
        --database-host='localhost'
      notify: restart_apache
      when: file_check.stat.exists == false

    - name: Fix missing indices on nextcloud database with OCC
      ansible.builtin.shell: |
        sudo -u www-data \
          php /var/www/nextcloud/occ \
          db:add-missing-indices
      notify: restart_apache
      when: file_check.stat.exists == false

    - name: Repair include expensive on nextcloud with OCC
      ansible.builtin.shell: |
        sudo -u www-data \
          php /var/www/nextcloud/occ \
          maintenance:repair \
          --include-expensive
      notify: restart_apache
      when: file_check.stat.exists == false

    - name: Include trusted domains on nextcloud with OCC
      ansible.builtin.shell: |
        sudo -u www-data \
          php /var/www/nextcloud/occ \
          config:system:set \
          trusted_domains 1 --value={{ NEXTCLOUD_HOST_ALIAS }}.{{ ansible_domain }}
      notify: restart_apache
      when: file_check.stat.exists == false

    - name: Include local memory cache on nextcloud with OCC
      ansible.builtin.shell: |
        sudo -u www-data \
          php /var/www/nextcloud/occ \
          config:system:set \
          memcache.local --value=\\OC\\Memcache\\APCu
      notify: restart_apache
      when: file_check.stat.exists == false

    - name: Include phone region on nextcloud with OCC
      ansible.builtin.shell: |
        sudo -u www-data \
          php /var/www/nextcloud/occ \
          config:system:set \
          default_phone_region --value=CU
      notify: restart_apache
      when: file_check.stat.exists == false

