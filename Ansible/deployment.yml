#####################################################

- name: debian server apache security module
  tags: web-secure, lamp-stack
  hosts:
    - lamp_stack
    - lamp
    - web
  tasks:
    - name: Enable SSL module with dependencies
      ansible.builtin.file:
        src: /etc/apache2/mods-available/{{ item }}
        dest: /etc/apache2/mods-enabled/{{ item }}
        state: link
      loop:
         - rewrite.load
         - socache_shmcb.load
         - ssl.load
         - ssl.conf
      notify: restart_apache

    - name: Force HTTP redirect to HTTPS
      ansible.builtin.copy:
        dest: /etc/apache2/sites-available/000-default.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          <VirtualHost *:80>
            RewriteEngine On
            RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
          </VirtualHost>
      notify: restart_apache

    - name: Enable default SSL site
      ansible.builtin.file:
        src: /etc/apache2/sites-available/default-ssl.conf
        dest: /etc/apache2/sites-enabled/default-ssl.conf
        state: link
      notify: restart_apache

  handlers:
    - name: restart_apache
      ansible.builtin.systemd_service:
        name: apache2
        masked: no
        enabled: true
        state: restarted

#####################################################
#         OWASP WEB for SERVICE via APACHE          #
#####################################################

- name: debian server apache security module
  tags: web-secure
  hosts:
    - lamp
    - web
  tasks:
    - name: Install apache security module
      ansible.builtin.apt:
        name:
          - libapache2-mod-security2
        state: latest
        update_cache: yes

    - name: Enable apache security module
      ansible.builtin.file:
        src: /etc/apache2/mods-available/{{ item }}
        dest: /etc/apache2/mods-enabled/{{ item }}
        state: link
      loop:
         - security2.load
         - security2.conf
      notify: restart_apache

    - name: Check if a local config file exist
      ansible.builtin.stat:
        path: /etc/modsecurity/modsecurity.conf
      register: file_check

    - name: Create a local config file
      ansible.builtin.copy:
        src: /etc/modsecurity/modsecurity.conf-recommended
        dest: /etc/modsecurity/modsecurity.conf
        remote_src: true
        owner: root
        group: root
        mode: '0644'
      when: file_check.stat.exists == false
      notify: restart_apache

    - name: Enable Rule Engine
      ansible.builtin.lineinfile:
        dest: /etc/modsecurity/modsecurity.conf
        regexp: "^SecRuleEngine"
        line: 'SecRuleEngine On'
      notify: restart_apache

    - name: Setting Tokens to Prod
      ansible.builtin.lineinfile:
        dest: /etc/apache2/conf-available/security.conf
        regexp: "^ServerTokens"
        line: 'ServerTokens Prod'
      notify: restart_apache

    - name: Disable Signature
      ansible.builtin.lineinfile:
        dest: /etc/apache2/conf-available/security.conf
        regexp: "^ServerSignature"
        line: 'ServerSignature Off'
      notify: restart_apache

    - name: Allow access request bodies
      ansible.builtin.lineinfile:
        dest: /etc/apache2/conf-available/security.conf
        regexp: "^SecRequestBodyAccess"
        line: 'SecRequestBodyAccess On'
      notify: restart_apache

    - name: Allow access response bodies
      ansible.builtin.lineinfile:
        dest: /etc/apache2/conf-available/security.conf
        regexp: "^SecResponseBodyAccess"
        line: 'SecResponseBodyAccess On'
      notify: restart_apache

    - name: Which response MIME types do you want to inspect
      ansible.builtin.lineinfile:
        dest: /etc/apache2/conf-available/security.conf
        regexp: "^SecResponseBodyMimeType"
        line: 'SecResponseBodyMimeType text/plain text/html text/xml application/octet-stream'
      notify: restart_apache

    - name: The location where ModSecurity will keep its persistent data
      ansible.builtin.lineinfile:
        dest: /etc/apache2/conf-available/security.conf
        regexp: "^SecDataDir"
        line: 'SecDataDir /tmp/'
      notify: restart_apache

    - name: Install the OWASP Core Rule Set
      ansible.builtin.apt:
        name:
          - modsecurity-crs
        state: latest
        update_cache: yes
      notify: restart_apache

  handlers:
    - name: restart_apache
      ansible.builtin.systemd_service:
        name: apache2
        masked: no
        enabled: true
        state: restarted

#####################################################
#         HIPS WEB for SERVICE via APACHE           #
#####################################################

- name: debian server apache evasive module
  tags: web-secure
  hosts:
    - lamp
    - web
  tasks:
    - name: Install apache evasive module
      ansible.builtin.apt:
        name:
          - libapache2-mod-evasive
        state: latest
        update_cache: yes

    - name: Enable evasive module
      ansible.builtin.file:
        src: /etc/apache2/mods-available/{{ item }}
        dest: /etc/apache2/mods-enabled/{{ item }}
        state: link
      loop:
         - evasive.load
         - evasive.conf
      notify: restart_apache

    - name: Setting the Track of who is accesing what
      ansible.builtin.lineinfile:
        dest: /etc/apache2/mods-available/evasive.conf
        regexp: "^    #DOSHashTableSize"
        line: '    DOSHashTableSize    3079'
      notify: restart_apache

    - name: Setting the threshold for the number of requests for the same page
      ansible.builtin.lineinfile:
        dest: /etc/apache2/mods-available/evasive.conf
        regexp: "^    #DOSPageCount"
        line: '    DOSPageCount        2'
      notify: restart_apache

    - name: Setting the threshold for the total number of requests for any object by the same client per site
      ansible.builtin.lineinfile:
        dest: /etc/apache2/mods-available/evasive.conf
        regexp: "^    #DOSSiteCount"
        line: '    DOSSiteCount        50'
      notify: restart_apache

    - name: Setting the interval used in the page count
      ansible.builtin.lineinfile:
        dest: /etc/apache2/mods-available/evasive.conf
        regexp: "^    #DOSPageInterval"
        line: '    DOSPageInterval     1'
      notify: restart_apache

    - name: Setting the interval used in the site count
      ansible.builtin.lineinfile:
        dest: /etc/apache2/mods-available/evasive.conf
        regexp: "^    #DOSSiteInterval"
        line: '    DOSSiteInterval     1'
      notify: restart_apache

    - name: Setting the amount of time (in seconds) that an IP is blocked
      ansible.builtin.lineinfile:
        dest: /etc/apache2/mods-available/evasive.conf
        regexp: "^    #DOSBlockingPeriod"
        line: '    DOSBlockingPeriod   10'
      notify: restart_apache

    - name: Creating the log directory
      ansible.builtin.file:
        path: /var/log/mod_evasive
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'

    - name: Setting the log directory location
      ansible.builtin.lineinfile:
        dest: /etc/apache2/mods-available/evasive.conf
        regexp: "^    #DOSLogDir"
        line: '    DOSLogDir           "/var/log/mod_evasive"'
      notify: restart_apache

  handlers:
    - name: restart_apache
      ansible.builtin.systemd_service:
        name: apache2
        masked: no
        enabled: true
        state: restarted

#####################################################
#                DNS EDGE DEPLOYMENT                #
#####################################################

- name: debian server dns edge configuration
  tags: dns-edge
  hosts:
    - dnsedge
  tasks:
    - name: Setting external options
      ansible.builtin.copy:
        dest: /etc/bind/named.conf.options
        owner: root
        group: bind
        mode: '0644'
        content: |
          options {
            directory "/var/cache/bind";
            allow-query { any; };
            allow-transfer { localhost; };
            recursion no;
            dnssec-validation auto;
            listen-on port 53 { any; };
            listen-on-v6 { any; };
            version "";
            rate-limit {
              ipv4-prefix-length 32;
              window 10;
              responses-per-second 25;
              errors-per-second 5;
              nxdomains-per-second 5;
              slip 2;
            };
          };
      notify: restart_bind9

    - name: add external zones file configuration
      ansible.builtin.lineinfile:
        path: /etc/bind/named.conf
        insertafter: 'hints\"\;$'
        line: 'include "/etc/bind/{{ named_conf_external_zone }}";'
        state: present
      notify: restart_bind9

    - name: copy external zones configuration
      ansible.builtin.copy:
        src: '{{ named_conf_external_zone }}'
        dest: /etc/bind/{{ named_conf_external_zone }}
        owner: root
        group: bind
        mode: '0644'
      notify: restart_bind9

    - name: copy external direct zone configuration
      ansible.builtin.copy:
        src: '{{ named_conf_external_zone_dir }}'
        dest: /var/cache/bind/zone.dir
        owner: root
        group: bind
        mode: '0644'
      notify: restart_bind9

    - name: copy external invert zone configuration
      ansible.builtin.copy:
        src: '{{ named_conf_external_zone_inv }}'
        dest: /var/cache/bind/zone.inv
        owner: root
        group: bind
        mode: '0644'
      notify: restart_bind9

  handlers:
    - name: restart_bind9
      ansible.builtin.systemd_service:
        name: bind9
        masked: no
        enabled: true
        state: restarted

#####################################################
#               LightSquid DEPLOYMENT                 #
#####################################################

- name: debian server lightsquid install
  tags: lightsquid
  hosts:
    - lightsquid
  tasks:
    - name: Install LightSquid
      ansible.builtin.apt:
        name:
          - lightsquid
          - libcgi-fast-perl
        state: latest
        update_cache: yes

    - name: Setting LightSquid log path
      ansible.builtin.lineinfile:
        dest: /etc/lightsquid/lightsquid.cfg
        regexp: '^$logpath'
        line: '$logpath = "/var/log/squid";'
      notify: restart_apache

#    - name: Setting LightSquid Date Stop
#      ansible.builtin.lineinfile:
#        dest: /usr/share/lightsquid/lightparser.pl
#        regexp: '^my $filterdatestop'
#        line: 'my $filterdatestop =timelocal(59,59,23,31,12-1,2100-1900)+1000;'
#      notify: restart_apache

    - name: Enable apache modules for LightSquid
      ansible.builtin.file:
        src: /etc/apache2/mods-available/{{ item }}
        dest: /etc/apache2/mods-enabled/{{ item }}
        state: link
      loop:
         - cgid.load
         - cgid.conf
      notify: restart_apache

    - name: Create LightSquid site configuration
      ansible.builtin.copy:
        dest: /etc/apache2/sites-available/lightsquid.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          <VirtualHost *:443>
            ServerName    {{ ansible_fqdn }}
            ServerAlias   {{ LightSquid_HOST_ALIAS }}.{{ ansible_domain }}
            DocumentRoot /usr/lib/cgi-bin/lightsquid/
            ErrorLog ${APACHE_LOG_DIR}/error.log
            CustomLog ${APACHE_LOG_DIR}/access.log combined
            SSLEngine on
            SSLCertificateFile      /etc/ssl/certs/ssl-cert-snakeoil.pem
            SSLCertificateKeyFile   /etc/ssl/private/ssl-cert-snakeoil.key
            <FilesMatch "\.(?:cgi|shtml|phtml|php)$">
                    SSLOptions +StdEnvVars
            </FilesMatch>
            <Directory /usr/lib/cgi-bin>
                    SSLOptions +StdEnvVars
            </Directory>
            <Directory "/usr/lib/cgi-bin/lightsquid/">
              Options +ExecCGI
              AddHandler cgi-script .cgi .pl
              DirectoryIndex index.cgi index.pl
              Require all granted
            </Directory>
          </VirtualHost>
      notify: restart_apache

    - name: Enable LightSquid SSL site
      ansible.builtin.file:
        src: /etc/apache2/sites-available/lightsquid.conf
        dest: /etc/apache2/sites-enabled/lightsquid.conf
        state: link
      notify: restart_apache

  handlers:
    - name: restart_apache
      ansible.builtin.systemd_service:
        name: apache2
        masked: no
        enabled: true
        state: restarted

