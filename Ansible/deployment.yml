---
# This config is designed to work on
# Debian 13.4 trixie and may work with
# other similar distros

####################################################
#        KERNEL CONFIGURATION for SECURITY         #
####################################################

- name: debian server kernel security configuration
  tags: kernel
  hosts:
    - server
  tasks:
    - name: Enable reverse path filtering for new network
      ansible.posix.sysctl:
        name: net.ipv4.conf.default.rp_filter
        value: 1
        sysctl_set: yes
        state: present
        reload: yes
        sysctl_file: /etc/sysctl.d/90-kernel.conf

    - name: Enable reverse path filtering for current network
      ansible.posix.sysctl:
        name: net.ipv4.conf.all.rp_filter
        value: 1
        sysctl_set: yes
        state: present
        reload: yes
        sysctl_file: /etc/sysctl.d/90-kernel.conf

    - name: Enable Log Martian Packets on all IPv4 Interfaces
      ansible.posix.sysctl:
        name: net.ipv4.conf.all.log_martians
        value: 1
        sysctl_set: yes
        state: present
        reload: yes
        sysctl_file: /etc/sysctl.d/90-kernel.conf

    - name: Specifies the maximum number of TCP connections
      ansible.posix.sysctl:
        name: net.ipv4.tcp_max_syn_backlog
        value: 2048
        sysctl_set: yes
        state: present
        reload: yes
        sysctl_file: /etc/sysctl.d/90-kernel.conf

    - name: Number of SYN packets the Kernel will send before giving up on the new connection
      ansible.posix.sysctl:
        name: net.ipv4.tcp_synack_retries
        value: 2
        sysctl_set: yes
        state: present
        reload: yes
        sysctl_file: /etc/sysctl.d/90-kernel.conf

    - name: Cantidad de reintentos de envío del paquete SYN para establecer una nueva conexion
      ansible.posix.sysctl:
        name: net.ipv4.tcp_syn_retries
        value: 5
        sysctl_set: yes
        state: present
        reload: yes
        sysctl_file: /etc/sysctl.d/90-kernel.conf

    - name: Ignore Bogus ICMP Error Responses on IPv4 Interfaces
      ansible.posix.sysctl:
        name: net.ipv4.icmp_ignore_bogus_error_responses
        value: 1
        sysctl_set: yes
        state: present
        reload: yes
        sysctl_file: /etc/sysctl.d/90-kernel.conf

    - name: Ensure TCP SYN Cookies is enabled
      ansible.posix.sysctl:
        name: net.ipv4.tcp_syncookies
        value: 1
        sysctl_set: yes
        state: present
        reload: yes
        sysctl_file: /etc/sysctl.d/90-kernel.conf

    - name: Enables the endpoints to keep a current measurement of the round-trip time (RTT) of the network between them
      ansible.posix.sysctl:
        name: net.ipv4.tcp_timestamps
        value: 0
        sysctl_set: yes
        state: present
        reload: yes
        sysctl_file: /etc/sysctl.d/90-kernel.conf

####################################################
#            REPOSITORIES CONFIGURATIONS           #
####################################################

- name: selfhosted debian repositories configuration
  tags: repositories
  hosts:
    - debselfhosted
  tasks:
    - name: Add debian repositories URL to hosts
      ansible.builtin.lineinfile:
        dest: /etc/hosts
        regexp: '{{ debian_self_hosted_find }}'
        line: "{{ debian_self_hosted_hosts }}"

    - name: Do not check repositories valid date
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          acquire::check-valid-until "0";

- name: selfhosted proxmox repositories configuration
  tags: repositories
  hosts:
    - pveselfhosted
  tasks:
    - name: Add proxmox repositories URL to hosts
      ansible.builtin.lineinfile:
        dest: /etc/hosts
        regexp: '{{ proxmox_self_hosted_find }}'
        line: "{{ proxmox_self_hosted_hosts }}"

- name: debian repositories configuration
  tags: repositories
  hosts:
    - debian
  tasks:
    - name: Delete obsolete config file
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list

    - name: Add debian main repositories
      ansible.builtin.deb822_repository:
        name: debian
        types: deb
        uris: "http://{{ debian_repositories_main }}/debian"
        suites:
          - trixie
          - trixie-updates
        components:
          - main
          - contrib
        architectures: amd64
        signed_by: /usr/share/keyrings/debian-archive-keyring.gpg
        state: present

    - name: Add debian security repositories
      ansible.builtin.deb822_repository:
        name: security
        types: deb
        uris: "http://{{ debian_repositories_security }}/debian-security"
        suites:
          - trixie-security
        components:
          - main
          - contrib
        architectures: amd64
        signed_by: /usr/share/keyrings/debian-archive-keyring.gpg
        state: present

- name: proxmox repositories configuration
  tags: repositories
  hosts:
    - proxmox
  tasks:
    - name: Delete enterprise proxmox config file
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/pve-enterprise.sources

    - name: Add proxmox main repositories
      ansible.builtin.deb822_repository:
        name: proxmox
        types: deb
        uris: "http://{{ proxmox_repositories }}/debian/pve"
        suites:
          - trixie
        components:
          - pve-no-subscription
        architectures: amd64
        signed_by: /usr/share/keyrings/proxmox-archive-keyring.gpg
        state: present

    - name: Add proxmox ceph repositories
      ansible.builtin.deb822_repository:
        name: ceph
        types: deb
        uris: "http://{{ proxmox_repositories }}/debian/ceph-squid"
        suites:
          - trixie
        components:
          - no-subscription
        architectures: amd64
        signed_by: /usr/share/keyrings/proxmox-archive-keyring.gpg
        state: present

####################################################
#                UPGRADE DISTRIBUTION              #
####################################################

- name: debian upgrade distribution
  tags: upgrade
  hosts:
    - debian
  tasks:
    - name: Update and Upgrade System
      ansible.builtin.apt:
        update_cache: yes
        upgrade: dist
        autoremove: yes
        autoclean: yes
        state: latest
        cache_valid_time: 0

####################################################
#        CREATE A NON ROOT USER for SECURITY       #
####################################################

- name: debian sudo user with public key
  tags: sudo-user
  hosts:
    - debian
  tasks:
    - name: Install sudo
      ansible.builtin.apt:
        name:
          - sudo
        state: latest
        update_cache: yes

    - name: Ensure group for new user exists
      ansible.builtin.group:
        name: "{{ SUDO_USER_NAME }}"
        state: present

    - name: Create a new user inside sudo group
      ansible.builtin.user:
        name: "{{ SUDO_USER_NAME }}"
        password: "{{ lookup('file', SUDO_USER_PASS) }}"
        state: present
        createhome: yes
        groups: "{{ SUDO_USER_NAME }},users,sudo"
        shell: /bin/bash

    - name: Add new user public key 
      ansible.builtin.authorized_key:
        user: "{{ SUDO_USER_NAME }}"
        key: "{{ lookup('file', SUDO_USER_PUB_KEY) }}"
        state: present

- name: proxmox pam pve user
  tags: sudo-user
  hosts:
    - proxmox
  tasks:
    - name: Create a proxmox PAM user Administrator
      ansible.builtin.blockinfile:
        path: /etc/pve/user.cfg
        create: yes
        block: |
          user:{{ SUDO_USER_NAME}}@pam:1:0::::::
          group:{{ SUDO_USER_NAME}}:{{ SUDO_USER_NAME}}@pam::
          acl:1:/:@{{ SUDO_USER_NAME}}:Administrator:

####################################################
#                   SPANISH SUPPORT                #
####################################################

- name: debian language spanish support
  tags: spanish-support
  hosts:
    - debian
  tasks:
    - name: Install spanish language
      ansible.builtin.apt:
        name:
          - task-spanish
        state: latest
        update_cache: yes

    - name: Ensure spanish language files are available
      ansible.builtin.locale_gen:
        name:
          - es_ES.UTF-8
        state: present

    - name: Enable spanish language short
      ansible.builtin.lineinfile:
        dest: /etc/default/locale
        regexp: "^LANG="
        line: 'LANG=es_ES.UTF-8'

    - name: Enable spanish language large
      ansible.builtin.lineinfile:
        dest: /etc/default/locale
        regexp: "^LANGUAGE="
        line: 'LANGUAGE="es_ES:es"'

    - name: Set timezone
      ansible.builtin.timezone:
        name: "America/Havana"

####################################################
#             INSTALL ADMINISTRATOR TOOLS          #
####################################################

- name: debian admin tools install
  tags: admin-tools
  hosts:
    - debian
  tasks:
    - name: remove nano text editor
      ansible.builtin.apt:
        name:
          - nano
        state: absent

    - name: install admin tools
      ansible.builtin.apt:
        name:
          - tmux
          - lynis
          - vim-tiny
          - bash-completion
        state: latest
        update_cache: yes

##########################################################
# ENABLE E-MAIL NOTIFICATION for SECURITY and MONITORING #
##########################################################

- name: debian server e-mail notification install
  tags: email-notification-enable
  hosts:
    - server
  tasks:
    - name: Install postfix, ssl-cert and bsd-mailx
      ansible.builtin.apt:
        name:
          - ssl-cert
          - postfix
          - bsd-mailx
        state: latest
        update_cache: yes

    - name: Config aliases
      ansible.builtin.copy:
        dest: /etc/aliases
        owner: root
        group: root
        mode: '0644'
        content: |
          postmaster: root
          webmaster: root
          root:	{{ EMAIL_NOTIFICATION }}
      notify: restart_aliases

    - name: Setting mail name
      ansible.builtin.copy:
        dest: /etc/mailname
        owner: root
        group: root
        mode: '0644'
        content: |
          {{ ansible_fqdn }}

    - name: Config domain origin
      ansible.builtin.lineinfile:
        dest: /etc/postfix/main.cf
        regexp: "^myorigin ="
        line: 'myorigin = {{ ansible_domain }}'
      notify: restart_postfix

    - name: Config domain name
      ansible.builtin.lineinfile:
        dest: /etc/postfix/main.cf
        regexp: "^mydomain ="
        line: 'mydomain = $myorigin'
      notify: restart_postfix

    - name: Config host name
      ansible.builtin.lineinfile:
        dest: /etc/postfix/main.cf
        regexp: "^myhostname ="
        line: 'myhostname = {{ ansible_hostname }}'
      notify: restart_postfix

    - name: Config helo name
      ansible.builtin.lineinfile:
        dest: /etc/postfix/main.cf
        regexp: "^smtp_helo_name ="
        line: 'smtp_helo_name = $myhostname.$mydomain'
      notify: restart_postfix

    - name: Config destination domains
      ansible.builtin.lineinfile:
        dest: /etc/postfix/main.cf
        regexp: "^mydestination ="
        line: 'mydestination = $myhostname.$mydomain, $myhostname.localdomain, localhost.localdomain, localhost, $myhostname'
      notify: restart_postfix

    - name: Config to listen only on localhost
      ansible.builtin.lineinfile:
        dest: /etc/postfix/main.cf
        regexp: "^inet_interfaces ="
        line: 'inet_interfaces = loopback-only'
      notify: restart_postfix

    - name: Enable postfix log
      ansible.builtin.lineinfile:
        dest: /etc/postfix/main.cf
        regexp: "^maillog_file ="
        line: 'maillog_file = /var/log/mail.log'
      notify: restart_postfix

    - name: Config postfix log rotation
      ansible.builtin.copy:
        dest: /etc/logrotate.d/postfix
        owner: root
        group: root
        mode: '0644'
        content: |
          /var/log/mail.log {
            daily
            dateext
            dateformat -%Y%m%d-%H%M%S
            missingok
            rotate 365
            compress
            sharedscripts
            delaycompress
            su root root
            create 640 root root
            postrotate
              if [ -d /run/systemd/system ] && command systemctl >/dev/null 2>&1 && systemctl is-active --quiet postlogd.service; then
                systemctl kill --kill-who main --signal=SIGHUP postlogd.service
              else
                invoke-rc.d postfix reload > /dev/null
              fi
            endscript
          }

    - name: Fix compatibility level
      ansible.builtin.lineinfile:
        dest: /etc/postfix/main.cf
        regexp: "^compatibility_level ="
        line: 'compatibility_level = 3.6'
      notify: restart_postfix

    - name: Secure banner message
      ansible.builtin.lineinfile:
        dest: /etc/postfix/main.cf
        regexp: "^smtpd_banner ="
        line: 'smtpd_banner = $myhostname.$mydomain ESMTP'
      notify: restart_postfix

    - name: Setting certificate for TLS client connections
      ansible.builtin.lineinfile:
        dest: /etc/postfix/main.cf
        regexp: "^smtp_tls_CAfile ="
        line: 'smtp_tls_CAfile = /etc/ssl/certs/ca-certificates.crt'
      notify: restart_postfix

    - name: Enable TLS client connections
      ansible.builtin.lineinfile:
        dest: /etc/postfix/main.cf
        regexp: "^smtp_tls_security_level ="
        line: 'smtp_tls_security_level = encrypt'
      notify: restart_postfix

  handlers:
    - name: restart_aliases
      ansible.builtin.shell: |
        newaliases

    - name: restart_postfix
      ansible.builtin.systemd_service:
        name: postfix
        masked: no
        enabled: true
        state: restarted

####################################################
#      ENABLE UPDATES UNATTENDED for SECURITY      #
####################################################

- name: debian upgrade unattended enable
  tags: upgrade-unattended-enable
  hosts:
    - debian
  tasks:
    - name: Install Unattended Upgrades
      ansible.builtin.apt:
        name:
          - unattended-upgrades
        state: latest
        update_cache: yes

    - name: Setting what and when to unattended upgrades
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/52unattended-upgrades
        owner: root
        group: root
        mode: '0644'
        content: |
          Unattended-Upgrade::Origins-Pattern {
            "origin=Debian,codename=${distro_codename}-updates";
            "origin=Debian,codename=${distro_codename},label=Debian";
            "origin=Debian,codename=${distro_codename},label=Debian-Security";
            "origin=Debian,codename=${distro_codename}-security,label=Debian-Security";
          };
          Unattended-Upgrade::Package-Blacklist {
          };
          Unattended-Upgrade::AutoFixInterruptedDpkg "true";
          Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
          Unattended-Upgrade::Remove-New-Unused-Dependencies "true";
          Unattended-Upgrade::Remove-Unused-Dependencies "true";
          Unattended-Upgrade::Automatic-Reboot "true";
          Unattended-Upgrade::Automatic-Reboot-WithUsers "true";
          Unattended-Upgrade::Automatic-Reboot-Time "04:00";
      notify: restart_unattended

    - name: Config unattended upgrades log
      ansible.builtin.copy:
        dest: /etc/logrotate.d/unattended-upgrades
        owner: root
        group: root
        mode: '0644'
        content: |
          /var/log/unattended-upgrades/unattended-upgrades.log 
          /var/log/unattended-upgrades/unattended-upgrades-dpkg.log
          /var/log/unattended-upgrades/unattended-upgrades-shutdown.log
          {
            daily
            dateext
            dateformat -%Y%m%d-%H%M%S
            missingok
            rotate 365
            compress
            sharedscripts
            delaycompress
          }

    - name: Enable unattended update, download, upgrade and clean Packages
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        owner: root
        group: root
        mode: '0644'
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
          APT::Periodic::AutocleanInterval "7";
          APT::Periodic::Download-Upgradeable-Packages "1";
      notify: restart_unattended

  handlers:
    - name: restart_unattended
      ansible.builtin.systemd_service:
        name: unattended-upgrades
        masked: no
        enabled: true
        state: restarted

####################################################
#      RESOURCES and PROCESSES for MONITORING      #
####################################################

- name: debian monitoring install
  tags: monit-enable
  hosts:
    - debian
  tasks:
    - name: Install monit
      ansible.builtin.apt:
        name:
          - monit
        state: latest
        update_cache: yes

    - name: Check resources each 1 min
      ansible.builtin.lineinfile:
        dest: /etc/monit/monitrc
        regexp: "^set daemon "
        line: 'set daemon 60'
      notify: restart_monit

    - name: Set log file location
      ansible.builtin.lineinfile:
        dest: /etc/monit/monitrc
        regexp: "^set logfile "
        line: 'set logfile /var/log/monit.log'
      notify: restart_monit

    - name: Setting monit log rotation
      ansible.builtin.copy:
        dest: /etc/logrotate.d/monit
        owner: root
        group: root
        mode: '0644'
        content: |
          /var/log/monit.log {
            daily
            dateext
            dateformat -%Y%m%d-%H%M%S
            missingok
            rotate 365
            compress
            sharedscripts
            delaycompress
            su root root
            create 640 root adm
            postrotate
              invoke-rc.d monit reload > /dev/null
            endscript
          }

    - name: Config how to monitor the resources
      ansible.builtin.copy:
        dest: /etc/monit/conf.d/CheckResources
        owner: root
        group: root
        mode: '0644'
        content: |
          check system $HOST
            if loadavg (1min) per core > 2 for 5 cycles then alert
            if loadavg (5min) per core > 1.5 for 10 cycles then alert
            if cpu usage > 95% for 10 cycles then alert
            if memory usage > 75% then alert
            if swap usage > 25% then alert
          check filesystem root with path /
            if space usage > 70% then alert
      notify: restart_monit

  handlers:
    - name: restart_monit
      ansible.builtin.systemd_service:
        name: monit
        masked: no
        enabled: true
        state: restarted

#####################################################
# SIMPLE NETWORK MANAGEMENT PROTOCOL for MONITORING #
#####################################################

- name: debian snmpd install
  tags: snmp-enable
  hosts:
    - debian
  tasks:
    - name: Install SNMPD
      ansible.builtin.apt:
        name:
          - snmpd
        state: latest
        update_cache: yes

    - name: Enable SNMPD Interfaces Access
      ansible.builtin.copy:
        dest: /etc/snmp/snmpd.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          sysLocation   {{ ansible_fqdn }}
          sysContact    {{ SNMP_CONTACT }}
          sysServices   72
          agentaddress  udp:0.0.0.0:161,udp6:[::]:161
          view          all included .1
          rocommunity   {{ SNMP_COMMUNITY }} default -V all
          rocommunity6  {{ SNMP_COMMUNITY }} default -V all
      notify: restart_snmpd

  handlers:
    - name: restart_snmpd
      ansible.builtin.systemd_service:
        name: snmpd
        masked: no
        enabled: true
        state: restarted

#####################################################
# DOCKER IO #
#####################################################

- name: debian docker engine install
  tags: docker-enable
  hosts:
    - docker
  tasks:
    - name: Install Docker and Compose
      ansible.builtin.apt:
        name:
          - docker.io
        state: latest
        update_cache: yes

#####################################################
# DOCKER IMAGE DOWNLOAD #
#####################################################

- name: debian docker image download for postfix (send-only)
  tags: docker-sendonly
  hosts:
    - docker
  tasks:
    - name: Download docker container image for debian
      ansible.builtin.docker_image:
        name: "debian:latest"
        source: pull

    - name: Start docker container image for debian
      ansible.builtin.docker_container:
        name: "base"
        image: "debian:latest"
        state: started
        restart: true

#####################################################
#          DOMAIN NAME SYSTEM for SERVICE           #
#####################################################

- name: debian server dns install
  tags: dns-enable
  hosts:
    - dns
  tasks:
    - name: Install bind9
      ansible.builtin.apt:
        name:
          - bind9
          - bind9utils
        state: latest
        update_cache: yes

    - name: Add log file configuration
      ansible.builtin.lineinfile:
        path: /etc/bind/named.conf
        insertafter: 'options\"\;$'
        line: 'include "/etc/bind/named.conf.logs";'
        state: present
      notify: restart_bind9

    - name: Creating the log directory
      ansible.builtin.file:
        path: /var/log/named
        state: directory
        owner: bind
        group: bind
        mode: '0755'

    - name: Setting logs options
      ansible.builtin.copy:
        dest: /etc/bind/named.conf.logs
        owner: root
        group: bind
        mode: '0644'
        content: |
          logging {
            channel security_file {
              file "/var/log/named/security.log" versions 3 size 30m;
              severity dynamic;
              print-time yes;
            };
            category security {
              security_file;
            };
          };
      notify: restart_bind9

    - name: Config bind9 log
      ansible.builtin.copy:
        dest: /etc/logrotate.d/named
        owner: root
        group: root
        mode: '0644'
        content: |
          /var/log/named/*.log
          {
            daily
            dateext
            dateformat -%Y%m%d-%H%M%S
            missingok
            rotate 365
            compress
            sharedscripts
            delaycompress
            create 660 bind bind
            postrotate
              /usr/sbin/rndc reconfig > /dev/null 2>/dev/null || true
            endscript
          }

  handlers:
    - name: restart_bind9
      ansible.builtin.systemd_service:
        name: bind9
        masked: no
        enabled: true
        state: restarted

#####################################################
#            WEB for SERVICE via APACHE             #
#####################################################

- name: debian server apache install
  tags: web-enable, lamp-stack
  hosts:
    - lamp_stack
    - lamp
    - web
  tasks:
    - name: Install apache
      ansible.builtin.apt:
        name:
          - apache2
        state: latest
        update_cache: yes

    - name: Config apache log rotation
      ansible.builtin.copy:
        dest: /etc/logrotate.d/apache2
        owner: root
        group: root
        mode: '0644'
        content: |
          /var/log/apache2/*.log
          {
            daily
            dateext
            dateformat -%Y%m%d-%H%M%S
            missingok
            rotate 365
            compress
            sharedscripts
            delaycompress
            create 640 root adm
            prerotate
              if [ -d /etc/logrotate.d/httpd-prerotate ]; then
                run-parts /etc/logrotate.d/httpd-prerotate
              fi
            endscript
            postrotate
              if pgrep -f ^/usr/sbin/apache2 > /dev/null; then
                invoke-rc.d apache2 reload 2>&1 | logger -t apache2.logrotate
              fi
            endscript
          }

#####################################################
#         DATABASE for SERVICE via MS SQL SERVER    #
#####################################################

- name: debian server mssql install
  tags: mssql-enable
  hosts:
    - mssql
  tasks:
    - name: Add MSSQL main repositories
      ansible.builtin.deb822_repository:
        name: mssql-server-2025sql
        types: deb
        uris: "https://packages.microsoft.com/ubuntu/24.04/mssql-server-2025"
        suites:
          - noble
        components:
          - main
        architectures: amd64
        signed_by: https://packages.microsoft.com/keys/microsoft.asc
        state: present

    - name: Install MSSQL
      ansible.builtin.apt:
        name:
          - mssql-server
        state: latest
        update_cache: yes

#####################################################
#         DATABASE for SERVICE via MARIADB          #
#####################################################

- name: debian server mariadb install
  tags: mariadb-enable, lamp-stack
  hosts:
    - lamp_stack
    - lamp
    - mariadb
  tasks:
    - name: Install MariaDB
      ansible.builtin.apt:
        name:
          - mariadb-server
        state: latest
        update_cache: yes

    - name: Install Ansible support for MariaDB
      ansible.builtin.apt:
        name:
          - python3-mysqldb
        state: latest
        update_cache: yes

    - name: Creating the log directory
      ansible.builtin.file:
        path: /var/log/mysql
        state: directory
        owner: mysql
        group: mysql
        mode: '0755'

    - name: Setting general log file
      ansible.builtin.lineinfile:
        dest: /etc/mysql/mariadb.conf.d/50-server.cnf
        regexp: "^#general_log_file"
        line: 'general_log_file       = /var/log/mysql/mysql.log'
      notify: restart_mariadb

    - name: Enable general log file
      ansible.builtin.lineinfile:
        dest: /etc/mysql/mariadb.conf.d/50-server.cnf
        regexp: "^#general_log  "
        line: 'general_log            = 1'
      notify: restart_mariadb

    - name: Setting log error file
      ansible.builtin.lineinfile:
        dest: /etc/mysql/mariadb.conf.d/50-server.cnf
        regexp: "^#log_error ="
        line: 'log_error = /var/log/mysql/error.log'
      notify: restart_mariadb

    - name: Config mariadb log rotation
      ansible.builtin.copy:
        dest: /etc/logrotate.d/mariadb
        owner: root
        group: root
        mode: '0644'
        content: |
          /var/lib/mysql/mysqld.log /var/lib/mysql/mariadb.log /var/log/mysql/*.log {
            daily
            dateext
            dateformat -%Y%m%d-%H%M%S
            missingok
            rotate 365
            compress
            sharedscripts
            delaycompress
            su mysql mysql
            create 640 mysql mysql
            postrotate
              if test -r /etc/mysql/debian.cnf
              then
                EXTRAPARAM='--defaults-file=/etc/mysql/debian.cnf'
              fi

              if test -x /usr/bin/mariadb-admin
              then
                /usr/bin/mariadb-admin $EXTRAPARAM --local flush-error-log \
                  flush-engine-log flush-general-log flush-slow-log
              fi
            endscript
          }

  handlers:
    - name: restart_mariadb
      ansible.builtin.systemd_service:
        name: mariadb
        masked: no
        enabled: true
        state: restarted

