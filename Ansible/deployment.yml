      ansible.builtin.copy:
        src: drupal-11.4.4.tar.gz
        dest: /tmp/drupal-11.4.4.tar.gz
      when: file_check.stat.exists == false

    - name: Extract Drupal archive
      ansible.builtin.unarchive:
        src: "/tmp/drupal-11.4.4.tar.gz"
        dest: "/tmp/"
        remote_src: yes
      when: file_check.stat.exists == false

    - name: Copy Drupal folder to /var/www
      ansible.builtin.copy:
        src: /tmp/drupal-11.4.4/
        dest: /var/www/drupal/
        remote_src: true
        owner: www-data
        group: www-data
        mode: '0755'
      when: file_check.stat.exists == false

    - name: Removing temporal files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/drupal-11.4.4.tar.gz
        - /tmp/drupal-11.4.4

    - name: Create Drupal mariadb
      ansible.builtin.mysql_db:
        name: "drupal"
        state: present

    - name: Create Drupal user for Drupal mariadb
      ansible.builtin.mysql_user:
        name: "{{ DRUPAL_DATABASE_USER }}"
        password: '{{ DRUPAL_DATABASE_PASS }}'
        priv: "drupal.*:ALL"
        host: 'localhost'
        state: present

    - name: Install Drupal PHP dependencies
      ansible.builtin.apt:
        name:
          - php-gd
          - php-apcu
        state: latest
        update_cache: yes

    - name: Enable CLI to PHP module APCU
      ansible.builtin.lineinfile:
        dest: /etc/php/8.4/mods-available/apcu.ini
        regexp: '^apc.enable_cli='
        line: "apc.enable_cli=1"
      notify: restart_php

    - name: Enable PHP module for fpm
      ansible.builtin.file:
        src: /etc/php/8.4/mods-available/{{ item }}.ini
        dest: /etc/php/8.4/fpm/conf.d/20-{{ item }}.ini
        state: link
      loop:
        - apcu
      notify: restart_php

    - name: Enable PHP module for apache
      ansible.builtin.file:
        src: /etc/php/8.4/mods-available/{{ item }}.ini
        dest: /etc/php/8.4/apache2/conf.d/20-{{ item }}.ini
        state: link
      loop:
        - apcu
      notify: restart_php

    - name: Enable PHP module for cli
      ansible.builtin.file:
        src: /etc/php/8.4/mods-available/{{ item }}.ini
        dest: /etc/php/8.4/cli/conf.d/20-{{ item }}.ini
        state: link
      loop:
        - apcu
      notify: restart_php

    - name: Create Drupal site configuration
      ansible.builtin.copy:
        dest: /etc/apache2/sites-available/drupal.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          <VirtualHost *:443>
            ServerName    {{ ansible_fqdn }}
            ServerAlias   {{ DRUPAL_HOST_ALIAS }}.{{ ansible_domain }}
            DocumentRoot  "/var/www/drupal/"
            ErrorLog ${APACHE_LOG_DIR}/error.log
            CustomLog ${APACHE_LOG_DIR}/access.log combined
            SSLEngine on
            SSLCertificateFile      /etc/ssl/certs/ssl-cert-snakeoil.pem
            SSLCertificateKeyFile   /etc/ssl/private/ssl-cert-snakeoil.key
            <FilesMatch "\.(?:cgi|shtml|phtml|php)$">
                    SSLOptions +StdEnvVars
            </FilesMatch>
            <Directory /usr/lib/cgi-bin>
                    SSLOptions +StdEnvVars
            </Directory>
            <Directory /var/www/drupal/>
              Options -Indexes +FollowSymLinks
              AllowOverride All
              Require all granted
            </Directory>
            DirectoryIndex index.php
          </VirtualHost>
      notify: restart_apache

    - name: Enable Drupal SSL site
      ansible.builtin.file:
        src: /etc/apache2/sites-available/drupal.conf
        dest: /etc/apache2/sites-enabled/drupal.conf
        state: link
      notify: restart_apache

  handlers:
    - name: restart_apache
      ansible.builtin.systemd_service:
        name: apache2
        masked: no
        enabled: true
        state: restarted

    - name: restart_php
      ansible.builtin.systemd_service:
        name: php8.4-fpm
        masked: no
        enabled: true
        state: restarted

- name: debian server drupal secure
  tags: drupal-secure
  hosts:
    - drupal_secure
  tasks:
    - name: Check if Drupal are installed and configured
      ansible.builtin.stat:
        path: /var/www/drupal/sites/default/settings.php
