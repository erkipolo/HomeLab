  handlers:
    - name: restart_fail2ban
      ansible.builtin.systemd_service:
        name: fail2ban
        masked: no
        enabled: true
        state: restarted

####################################################
#              NEXTCLOUD DEPLOYMENT                #
####################################################

- name: debian server nextcloud install
  tags: nextcloud
  hosts:
    - nextcloud
  tasks:
    - name: Check if NextCloud archive are downloaded
      delegate_to: localhost
      ansible.builtin.stat:
        path: /home/ppcojo/Documentos/GitHub/HomeLab/Ansible/files/nextcloud-32.0.2.tar.gz
      register: file_check

    - name: Download NextCloud archive
      delegate_to: localhost
      get_url:
        url: "https://download.nextcloud.com/server/releases/nextcloud-32.0.2.tar.gz"
        dest: "/home/ppcojo/Documentos/GitHub/HomeLab/Ansible/files/nextcloud-32.0.2.tar.gz"
        owner: "ppcojo"
        group: "ppcojo"
        mode: '0755'
      when: file_check.stat.exists == false

    - name: Check if nextcloud are installed
      ansible.builtin.stat:
        path: /var/www/nextcloud/config/config.php
      register: file_check

    - name: upload nextcloud archive
      ansible.builtin.copy:
        src: nextcloud-32.0.2.tar.gz
        dest: /tmp/nextcloud.tar.gz
      when: file_check.stat.exists == false

    - name: Extract nextcloud archive
      ansible.builtin.unarchive:
        src: "/tmp/nextcloud.tar.gz"
        dest: "/tmp/"
        remote_src: yes
      when: file_check.stat.exists == false

    - name: Copy nextcloud folder to /var/www
      ansible.builtin.copy:
        src: /tmp/nextcloud/
        dest: /var/www/nextcloud/
        remote_src: true
        owner: www-data
        group: www-data
        mode: '0755'
      when: file_check.stat.exists == false

    - name: Create data directory for the nextcloud
      ansible.builtin.file:
        path: /var/www/nextcloud/data
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'
      when: file_check.stat.exists == false

    - name: Removing temporal files
      ansible.builtin.file:
          path: "{{ item }}"
          state: absent
      loop:
         - /tmp/nextcloud.tar.gz
         - /tmp/nextcloud

    - name: Create nextcloud mariadb
      ansible.builtin.mysql_db:
        name: "nextcloud"
        state: present

    - name: Create nextcloud user for nextcloud mariadb
      ansible.builtin.mysql_user:
        name: "{{ NEXTCLOUD_DATABASE_USER }}"
        password: '{{ NEXTCLOUD_DATABASE_PASS }}'
        priv: "nextcloud.*:ALL"
        host: 'localhost'
        state: present

    - name: Install nextcloud PHP dependencies
      ansible.builtin.apt:
        name:
          - php-gd
          - php-gmp
          - php-apcu
          - php-intl
          - php-ldap
          - php-bcmath
          - php-zip
          - php-imagick
        state: latest
        update_cache: yes

    - name: Install nextcloud software dependencies
      ansible.builtin.apt:
        name:
          - zip
          - unzip
          - imagemagick-7.q16
        state: latest
        update_cache: yes

    - name: Enable CLI to PHP module APCU
      ansible.builtin.lineinfile:
        dest: /etc/php/8.4/mods-available/apcu.ini
        regexp: '^apc.enable_cli='
        line: "apc.enable_cli=1"
      notify: restart_php

    - name: Enable PHP module for fpm
      ansible.builtin.file:
        src: /etc/php/8.4/mods-available/{{ item }}.ini
        dest: /etc/php/8.4/fpm/conf.d/20-{{ item }}.ini
        state: link
      loop:
        - gmp
        - apcu
        - intl
        - bcmath
        - zip
        - imagick
      notify: restart_php

    - name: Enable PHP module for apache
      ansible.builtin.file:
        src: /etc/php/8.4/mods-available/{{ item }}.ini
        dest: /etc/php/8.4/apache2/conf.d/20-{{ item }}.ini
        state: link
      loop:
        - gmp
        - apcu
        - intl
        - bcmath
        - zip
        - imagick
      notify: restart_php

    - name: Enable PHP module for cli
      ansible.builtin.file:
        src: /etc/php/8.4/mods-available/{{ item }}.ini
        dest: /etc/php/8.4/cli/conf.d/20-{{ item }}.ini
        state: link
      loop:
        - gmp
        - apcu
        - intl
        - bcmath
        - zip
        - imagick
      notify: restart_php

    - name: Give execution permissions to OCC
      ansible.builtin.file:
        path: /var/www/nextcloud/occ
        owner: www-data
        group: www-data
        mode: '0755'
      when: file_check.stat.exists == false

    - name: Install nextcloud with OCC
      ansible.builtin.shell: |
        sudo -u www-data \
        php /var/www/nextcloud/occ \
        maintenance:install \
        --admin-user='{{ NEXTCLOUD_ADMIN_USER }}' \
        --admin-pass='{{ NEXTCLOUD_ADMIN_PASS }}' \
        --data-dir='/var/www/nextcloud/data' \
        --database='mysql' \
        --database-name='nextcloud' \
        --database-user='{{ NEXTCLOUD_DATABASE_USER }}' \
        --database-pass='{{ NEXTCLOUD_DATABASE_PASS }}' \
        --database-host='localhost'
      notify: restart_apache
      when: file_check.stat.exists == false

    - name: Fix missing indices on nextcloud mariadb with OCC
      ansible.builtin.shell: |
        sudo -u www-data \
          php /var/www/nextcloud/occ \
          db:add-missing-indices
      notify: restart_apache
      when: file_check.stat.exists == false

    - name: Repair include expensive on nextcloud with OCC
      ansible.builtin.shell: |
        sudo -u www-data \
          php /var/www/nextcloud/occ \
          maintenance:repair \
          --include-expensive
      notify: restart_apache
      when: file_check.stat.exists == false

    - name: Include trusted domains on nextcloud with OCC
      ansible.builtin.shell: |
        sudo -u www-data \
          php /var/www/nextcloud/occ \
          config:system:set \
          trusted_domains 1 --value={{ NEXTCLOUD_HOST_ALIAS }}.{{ ansible_domain }}
      notify: restart_apache
      when: file_check.stat.exists == false

    - name: Include local memory cache on nextcloud with OCC
      ansible.builtin.shell: |
        sudo -u www-data \
          php /var/www/nextcloud/occ \
          config:system:set \
          memcache.local --value=\\OC\\Memcache\\APCu
      notify: restart_apache
      when: file_check.stat.exists == false

    - name: Include phone region on nextcloud with OCC
      ansible.builtin.shell: |
        sudo -u www-data \
          php /var/www/nextcloud/occ \
          config:system:set \
          default_phone_region --value=CU
