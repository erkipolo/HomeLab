            ServerName    {{ ansible_fqdn }}
            ServerAlias   {{ NEXTCLOUD_HOST_ALIAS }}.{{ ansible_domain }}
            ErrorLog ${APACHE_LOG_DIR}/error.log
            CustomLog ${APACHE_LOG_DIR}/access.log combined
            SSLEngine on
            SSLCertificateFile      /etc/ssl/certs/ssl-cert-snakeoil.pem
            SSLCertificateKeyFile   /etc/ssl/private/ssl-cert-snakeoil.key
            <FilesMatch "\.(?:cgi|shtml|phtml|php)$">
                    SSLOptions +StdEnvVars
            </FilesMatch>
            <Directory /usr/lib/cgi-bin>
                    SSLOptions +StdEnvVars
            </Directory>
            <Directory "/var/www/nextcloud/">
              Options MultiViews FollowSymlinks
              AllowOverride All
              Order allow,deny
              Allow from all
            </Directory>
          </VirtualHost>
      notify: restart_apache

    - name: Enable nextcloud SSL site
      ansible.builtin.file:
        src: /etc/apache2/sites-available/nextcloud.conf
        dest: /etc/apache2/sites-enabled/nextcloud.conf
        state: link
      notify: restart_apache

    - name: Enable apache modules for nextcloud
      ansible.builtin.file:
        src: /etc/apache2/mods-available/{{ item }}
        dest: /etc/apache2/mods-enabled/{{ item }}
        state: link
      loop:
         - dir.load
         - dir.conf
         - env.load
         - headers.load
         - mime.load
         - mime.conf
      notify: restart_apache

  handlers:
    - name: restart_apache
      ansible.builtin.systemd_service:
        name: apache2
        masked: no
        enabled: true
        state: restarted

    - name: restart_php
      ansible.builtin.systemd_service:
