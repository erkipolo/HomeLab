- name: debian server php common dependencies
  tags: lamp, lamp-stack
  hosts:
    - lamp_stack
    - lamp
  tasks:
    - name: Install PHP common dependencies
      ansible.builtin.apt:
        name:
          - php-cli
          - php-zip
          - php-xml
          - php-curl
          - php-common
          - php-mbstring
        state: latest
        update_cache: yes

    - name: Setting PHP timezone
      ansible.builtin.lineinfile:
        dest: '{{ item }}'
        regexp: '^;date.timezone ='
        line: "date.timezone = America/Havana"
      loop:
        - '/etc/php/8.4/apache2/php.ini'
        - '/etc/php/8.4/cli/php.ini'
        - '/etc/php/8.4/fpm/php.ini'
      notify: restart_php

    - name: Increase PHP memory limit
      ansible.builtin.lineinfile:
        dest: '{{ item }}'
        regexp: '^memory_limit ='
        line: "memory_limit = 512M"
      loop:
        - '/etc/php/8.4/apache2/php.ini'
        - '/etc/php/8.4/cli/php.ini'
        - '/etc/php/8.4/fpm/php.ini'
      notify: restart_php

    - name: Increase PHP execution time limit
      ansible.builtin.lineinfile:
        dest: '{{ item }}'
        regexp: '^max_execution_time ='
        line: "max_execution_time = 360"
      loop:
        - '/etc/php/8.4/apache2/php.ini'
        - '/etc/php/8.4/cli/php.ini'
        - '/etc/php/8.4/fpm/php.ini'
      notify: restart_php

    - name: Increase PHP filesize limit to upload
      ansible.builtin.lineinfile:
        dest: '{{ item }}'
        regexp: '^upload_max_filesize ='
        line: "upload_max_filesize = 200M"
      loop:
        - '/etc/php/8.4/apache2/php.ini'
        - '/etc/php/8.4/cli/php.ini'
        - '/etc/php/8.4/fpm/php.ini'
      notify: restart_php

    - name: Increase PHP size of POST data limit
      ansible.builtin.lineinfile:
        dest: '{{ item }}'
        regexp: '^post_max_size ='
        line: "post_max_size = 200M"
      loop:
        - '/etc/php/8.4/apache2/php.ini'
        - '/etc/php/8.4/cli/php.ini'
        - '/etc/php/8.4/fpm/php.ini'
      notify: restart_php

    - name: Increase PHP input time limit
      ansible.builtin.lineinfile:
        dest: '{{ item }}'
        regexp: '^max_input_time ='
        line: "max_input_time = 300"
      loop:
        - '/etc/php/8.4/apache2/php.ini'
        - '/etc/php/8.4/cli/php.ini'
        - '/etc/php/8.4/fpm/php.ini'
      notify: restart_php

    - name: Enable PHP opcache
      ansible.builtin.lineinfile:
        dest: '{{ item }}'
        regexp: '^;opcache.enable='
        line: "opcache.enable=1"
      loop:
        - '/etc/php/8.4/apache2/php.ini'
        - '/etc/php/8.4/cli/php.ini'
        - '/etc/php/8.4/fpm/php.ini'
      notify: restart_php

    - name: Increase PHP amount of memory for interned strings for opcache
      ansible.builtin.lineinfile:
        dest: '{{ item }}'
        regexp: '^;opcache.interned_strings_buffer='
        line: "opcache.interned_strings_buffer=16"
      loop:
        - '/etc/php/8.4/apache2/php.ini'
        - '/etc/php/8.4/cli/php.ini'
        - '/etc/php/8.4/fpm/php.ini'
      notify: restart_php

    - name: Setting PHP maximum number of keys for opcache
      ansible.builtin.lineinfile:
        dest: '{{ item }}'
        regexp: '^;opcache.max_accelerated_files='
        line: "opcache.max_accelerated_files=10000"
      loop:
        - '/etc/php/8.4/apache2/php.ini'
        - '/etc/php/8.4/cli/php.ini'
        - '/etc/php/8.4/fpm/php.ini'
      notify: restart_php

    - name: Setting PHP opcache shared memory
      ansible.builtin.lineinfile:
        dest: '{{ item }}'
        regexp: '^;opcache.memory_consumption='
        line: "opcache.memory_consumption=128"
      loop:
        - '/etc/php/8.4/apache2/php.ini'
        - '/etc/php/8.4/cli/php.ini'
        - '/etc/php/8.4/fpm/php.ini'
      notify: restart_php

    - name: Setting PHP opcache how often to check file for changes
      ansible.builtin.lineinfile:
        dest: '{{ item }}'
        regexp: '^;opcache.revalidate_freq='
        line: "opcache.revalidate_freq=1"
      loop:
        - '/etc/php/8.4/apache2/php.ini'
        - '/etc/php/8.4/cli/php.ini'
        - '/etc/php/8.4/fpm/php.ini'
      notify: restart_php

    - name: Enable PHP opcache comments
      ansible.builtin.lineinfile:
        dest: '{{ item }}'
        regexp: '^;opcache.save_comments='
        line: "opcache.save_comments=1"
      loop:
        - '/etc/php/8.4/apache2/php.ini'
        - '/etc/php/8.4/cli/php.ini'
        - '/etc/php/8.4/fpm/php.ini'
      notify: restart_php

  handlers:
    - name: restart_php
      ansible.builtin.systemd_service:
        name: php8.4-fpm
        masked: no
        enabled: true
        state: restarted

