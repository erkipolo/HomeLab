      ansible.builtin.apt:
        name:
          - dokuwiki
          - dokuwiki-plugins-extra
          - dokuwiki-templates-extra
        state: latest
        update_cache: yes

    - name: Allow access from all
      ansible.builtin.lineinfile:
        dest: /etc/dokuwiki/apache.conf
        regexp: 'Allow from localhost 127\.0\.0\.1 \:\:1'
        line: 'Allow from all'
      notify: restart_apache

    - name: Set Dokuwiki configuration permissions
      ansible.builtin.file:
        path: "/var/lib/dokuwiki/lib/{{ item }}"
        # state: directory
        mode: "0775"
        owner: "root"
        group: "www-data"
        recurse: yes
      with_items:
        - plugins/
        - tpl
      notify: restart_apache

    - name: Add Dokuwiki Administrator user
      ansible.builtin.copy:
        dest: /var/lib/dokuwiki/acl/users.auth.php
        owner: root
        group: root
        mode: '0644'
        content: |
          {{ DOKUWIKI_USER }}:{{ lookup('file', DOKUWIKI_PASS) }}:DokuWiki Administrator:{{ EMAIL_NOTIFICATION}}:admin,user
      notify: restart_apache

    - name: Create Dokuwiki site configuration
      ansible.builtin.copy:
        dest: /etc/apache2/sites-available/dokuwiki.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          <VirtualHost *:443>
            ServerName    {{ ansible_fqdn }}
            ServerAlias   {{ DOKUWIKI_HOST_ALIAS }}.{{ ansible_domain }}
            DocumentRoot  "/usr/share/dokuwiki"
            ErrorLog ${APACHE_LOG_DIR}/error.log
            CustomLog ${APACHE_LOG_DIR}/access.log combined
            SSLEngine on
            SSLCertificateFile      /etc/ssl/certs/ssl-cert-snakeoil.pem
            SSLCertificateKeyFile   /etc/ssl/private/ssl-cert-snakeoil.key
            <FilesMatch "\.(?:cgi|shtml|phtml|php)$">
                    SSLOptions +StdEnvVars
            </FilesMatch>
            <Directory /usr/lib/cgi-bin>
                    SSLOptions +StdEnvVars
            </Directory>
            DirectoryIndex index.php
            Include conf-enabled/dokuwiki.conf
          </VirtualHost>
      notify: restart_apache

    - name: Enable Dokuwiki SSL site
      ansible.builtin.file:
        src: /etc/apache2/sites-available/dokuwiki.conf
        dest: /etc/apache2/sites-enabled/dokuwiki.conf
        state: link
      notify: restart_apache

  handlers:
    - name: restart_apache
      ansible.builtin.systemd_service:
        name: apache2
        masked: no
        enabled: true
        state: restarted

#####################################################
#               FIREWALL for SECURITY               #
#####################################################

- name: debian server firewall install and add ssh access rules
  tags: iptables-enable
  hosts:
    - server
  tasks:
    - name: Install iptables
      ansible.builtin.apt:
        name: iptables-persistent
        state: latest
        update_cache: yes

    - name: ACCEPT INPUT ESTABLISHED,RELATED
      ansible.builtin.iptables:
        table: filter
        chain: INPUT
        chain_management: true
        state: present
        action: append
        ctstate: ESTABLISHED,RELATED
        jump: ACCEPT
        comment: 'ESTABLISHED,RELATED'
      notify: save_rules

    - name: ACCEPT INPUT loopback
      ansible.builtin.iptables:
        table: filter
        chain: INPUT
        chain_management: true
        state: present
        action: append
        in_interface: lo
        jump: ACCEPT
        comment: 'loopback'
      notify: save_rules

    - name: ACCEPT INPUT PING IPv4
      ansible.builtin.iptables:
        table: filter
        chain: INPUT
        chain_management: true
        state: present
        action: append
        protocol: icmp
        jump: ACCEPT
        comment: 'ICMP'
        ip_version: ipv4
      notify: save_rules

    - name: ACCEPT FORWARD ESTABLISHED,RELATED
      ansible.builtin.iptables:
        table: filter
        chain: FORWARD
        chain_management: true
        state: present
        action: append
        ctstate: ESTABLISHED,RELATED
        jump: ACCEPT
        comment: 'ESTABLISHED,RELATED'
      notify: save_rules

    - name: ACCEPT FORWARD PING IPv4
      ansible.builtin.iptables:
        table: filter
        chain: FORWARD
        chain_management: true
        state: present
        action: append
        protocol: icmp
        jump: ACCEPT
        comment: 'ICMP'
        ip_version: ipv4
      notify: save_rules

  handlers:
    - name: save_rules
      ansible.builtin.shell: |
        iptables-save > /etc/iptables/rules.v4
        ip6tables-save > /etc/iptables/rules.v6

