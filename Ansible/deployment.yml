---
# This config is designed to work on
# Debian 13.3 trixie and may work with
# other similar distros
- name: selfhosted debian repositories configuration
  tags: repositories
  hosts:
    - debian
  tasks:
    - name: Add debian repositories URL to hosts
      ansible.builtin.lineinfile:
        dest: /etc/hosts
        regexp: '{{ debian_self_hosted_find }}'
        line: "{{ debian_self_hosted_hosts }}"

    - name: Do not check repositories valid date
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          acquire::check-valid-until "0";

- name: selfhosted proxmox repositories configuration
  tags: repositories
  hosts:
    - proxmox
  tasks:
    - name: Add proxmox repositories URL to hosts
      ansible.builtin.lineinfile:
        dest: /etc/hosts
        regexp: '{{ proxmox_self_hosted_find }}'
        line: "{{ proxmox_self_hosted_hosts }}"

- name: debian repositories configuration
  tags: repositories
  hosts:
    - debian
  tasks:
    - name: Delete obsolete config file
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list

    - name: Add debian main repositories
      ansible.builtin.deb822_repository:
        name: debian
        types: deb
        uris: http://deb.debian.org/debian
        suites:
          - trixie
          - trixie-updates
        components:
          - main
          - contrib
        architectures: amd64
        signed_by: /usr/share/keyrings/debian-archive-keyring.gpg
        state: present

    - name: Add debian security repositories
      ansible.builtin.deb822_repository:
        name: security
        types: deb
        uris: http://security.debian.org/debian-security
        suites:
          - trixie-security
        components:
          - main
          - contrib
        architectures: amd64
        signed_by: /usr/share/keyrings/debian-archive-keyring.gpg
        state: present

- name: debian upgrade distribution
  tags: upgrade
  hosts:
    - debian
  tasks:
    - name: Update and Upgrade System
      ansible.builtin.apt:
        update_cache: yes
        upgrade: dist
        autoremove: yes
        autoclean: yes
        state: latest
        cache_valid_time: 0

- name: debian language spanish support
  tags: language
  hosts:
    - debian
  tasks:
    - name: Install localisation for spanish
      ansible.builtin.apt:
        name:
          - task-spanish
        state: latest

    - name: Ensure localisation files are available
      ansible.builtin.locale_gen:
        name:
          - es_ES.UTF-8
        state: present

    - name: Enable spanish localisation short
      ansible.builtin.lineinfile:
        dest: /etc/default/locale
        regexp: "^LANG="
        line: 'LANG=es_ES.UTF-8'

    - name: Enable spanish localisation large
      ansible.builtin.lineinfile:
        dest: /etc/default/locale
        regexp: "^LANGUAGE="
        line: 'LANGUAGE="es_ES:es"'

    - name: Set timezone
      ansible.builtin.timezone:
        name: "America/Havana"

- name: debian upgrade unattended install
  tags: upgrade-unattended
  hosts:
    - debian
  tasks:
    - name: Install Unattended Upgrades
      ansible.builtin.apt:
        name:
          - unattended-upgrades
        state: latest

    - name: Setting what and when to unattended upgrades
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/52unattended-upgrades
        owner: root
        group: root
        mode: '0644'
        content: |
          Unattended-Upgrade::Origins-Pattern {
            "origin=Debian,codename=${distro_codename}-updates";
            "origin=Debian,codename=${distro_codename},label=Debian";
            "origin=Debian,codename=${distro_codename},label=Debian-Security";
            "origin=Debian,codename=${distro_codename}-security,label=Debian-Security";
          };
          Unattended-Upgrade::Package-Blacklist {
          };
          Unattended-Upgrade::AutoFixInterruptedDpkg "true";
          Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
          Unattended-Upgrade::Remove-New-Unused-Dependencies "true";
          Unattended-Upgrade::Remove-Unused-Dependencies "true";
          Unattended-Upgrade::Automatic-Reboot "true";
          Unattended-Upgrade::Automatic-Reboot-WithUsers "true";
          Unattended-Upgrade::Automatic-Reboot-Time "04:00";
      notify: restart_unattended

    - name: Config unattended upgrades log
      ansible.builtin.copy:
        dest: /etc/logrotate.d/unattended-upgrades
        owner: root
        group: root
        mode: '0644'
        content: |
          /var/log/unattended-upgrades/unattended-upgrades.log 
          /var/log/unattended-upgrades/unattended-upgrades-dpkg.log
          /var/log/unattended-upgrades/unattended-upgrades-shutdown.log
          {
            daily
            dateext
            dateformat -%Y%m%d-%H%M%S
            missingok
            rotate 365
            compress
          }

    - name: Enable unattended update, download, upgrade and clean Packages
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        owner: root
        group: root
        mode: '0644'
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
          APT::Periodic::AutocleanInterval "7";
          APT::Periodic::Download-Upgradeable-Packages "1";
      notify: restart_unattended

  handlers:
    - name: restart_unattended
      ansible.builtin.systemd_service:
        name: unattended-upgrades
        masked: no
        enabled: true
        state: restarted

- name: debian sudo user with public key
  tags: user
  hosts:
    - debian
  tasks:
    - name: Create a new user
      ansible.builtin.user:
        name: "{{ SUDO_USER_NAME }}"
        password: "{{ lookup('file', SUDO_USER_PASS) }}"
        state: present
        createhome: yes
        shell: /bin/bash

    - name: Add new user public key 
      ansible.builtin.authorized_key:
        user: "{{ SUDO_USER_NAME }}"
        key: "{{ lookup('file', SUDO_USER_PUB_KEY) }}"
        state: present

    - name: Install sudo
      ansible.builtin.apt:
        name:
          - sudo
        state: latest

    - name: Add new user to sudo group
      ansible.builtin.blockinfile:
        path: /etc/sudoers.d/{{ SUDO_USER_NAME }}
        create: yes
        block: |
          {{ SUDO_USER_NAME}} ALL=(ALL:ALL) ALL

- name: debian secure ssh service
  tags: securessh
  hosts:
    - debian
  tasks:
    - name: Create a new ssh config file
      ansible.builtin.blockinfile:
        path: /etc/ssh/sshd_config.d/SecureSSH.conf
        create: yes
        block: |
          Port 22
          AddressFamily inet
          HostKey /etc/ssh/ssh_host_rsa_key
          HostKey /etc/ssh/ssh_host_ed25519_key
          PermitRootLogin no
          MaxAuthTries 1
          MaxSessions 2
          PubkeyAuthentication yes
          PasswordAuthentication no
          PermitEmptyPasswords no
          KbdInteractiveAuthentication no
          X11Forwarding no
          AuthenticationMethods publickey
          KexAlgorithms curve25519-sha256@libssh.org,ecdh-sha2-nistp521,ecdh-sha2-nistp384,ecdh-sha2-nistp256,diffie-hellman-group-exchange-sha256
          Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr
          MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com,hmac-sha2-512,hmac-sha2-256,umac-128@openssh.com      
      notify: restart_ssh
  handlers:
    - name: restart_ssh
      ansible.builtin.systemd_service:
        name: ssh
        masked: no
        enabled: true
        state: restarted

- name: debian hips install
  tags: hips
  hosts:
    - debian
  tasks:
    - name: Install fail2ban
      ansible.builtin.apt:
        name:
          - fail2ban
        state: latest

    - name: Check if a local config exist
      ansible.builtin.stat:
        path: /etc/fail2ban/jail.local
      register: file_check

    - name: Create a local config file
      ansible.builtin.copy:
        src: /etc/fail2ban/jail.conf
        dest: /etc/fail2ban/jail.local
        remote_src: true
        owner: root
        group: root
        mode: '0644'
      when: file_check.stat.exists == false

    - name: Change Ban Time
      ansible.builtin.lineinfile:
        dest: /etc/fail2ban/jail.local
        regexp: "^bantime  = 10m"
        line: 'bantime  = 10h'
      notify: restart_fail2ban

    - name: Change Max Retry
      ansible.builtin.lineinfile:
        dest: /etc/fail2ban/jail.local
        regexp: "^maxretry = 5"
        line: 'maxretry = 3'
      notify: restart_fail2ban

    - name: Setting fail2ban log rotation
      ansible.builtin.copy:
        dest: /etc/logrotate.d/fail2ban
        owner: root
        group: root
        mode: '0644'
        content: |
          /var/log/fail2ban.log {
            daily
            dateext
            dateformat -%Y%m%d-%H%M%S
            missingok
            rotate 365
            compress
            delaycompress
            su root root
            create 640 root adm
            postrotate
              fail2ban-client flushlogs 1>/dev/null
            endscript
          }

  handlers:
    - name: restart_fail2ban
      ansible.builtin.systemd_service:
        name: fail2ban
        masked: no
        enabled: true
        state: restarted

- name: debian hips ssh supervision
  tags: hips
  hosts:
    - debian
  tasks:
    - name: Enable SSH supervision
      ansible.builtin.lineinfile:
        path: /etc/fail2ban/jail.local
        insertafter: '^\[sshd\]'
        line: 'enabled = true'
        state: present
      notify: restart_fail2ban

  handlers:
    - name: restart_fail2ban
      ansible.builtin.systemd_service:
        name: fail2ban
        masked: no
        enabled: true
        state: restarted

- name: debian snmp install
  tags: snmp
  hosts:
    - debian
  tasks:
    - name: Install SNMP
      ansible.builtin.apt:
        name:
          - snmpd
        state: latest

    - name: Enable SNMP Interfaces Access
      ansible.builtin.copy:
        dest: /etc/snmp/snmpd.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          sysLocation   {{ ansible_fqdn }}
          sysContact    {{ SNMP_CONTACT }}
          sysServices   72
          agentaddress  udp:0.0.0.0:161,udp6:[::]:161
          view          all included .1
          rocommunity   {{ SNMP_COMMUNITY }} default -V all
          rocommunity6  {{ SNMP_COMMUNITY }} default -V all
      notify: restart_snmpd

  handlers:
    - name: restart_snmpd
      ansible.builtin.systemd_service:
        name: snmpd
        masked: no
        enabled: true
        state: restarted

- name: debian monitoring install
  tags: monit
  hosts:
    - debian
  tasks:
    - name: Install monit
      ansible.builtin.apt:
        name:
          - monit
        state: latest

    - name: Check resources each 1 min
      ansible.builtin.lineinfile:
        dest: /etc/monit/monitrc
        regexp: "^set daemon "
        line: 'set daemon 60'
      notify: restart_monit

    - name: Set log file location
      ansible.builtin.lineinfile:
        dest: /etc/monit/monitrc
        regexp: "^set logfile "
        line: 'set logfile /var/log/monit.log'
      notify: restart_monit

    - name: Setting monit log rotation
      ansible.builtin.copy:
        dest: /etc/logrotate.d/monit
        owner: root
        group: root
        mode: '0644'
        content: |
          /var/log/monit.log {
            daily
            dateext
            dateformat -%Y%m%d-%H%M%S
            missingok
            rotate 365
            compress
            delaycompress
            su root root
            create 640 root adm
            postrotate
              invoke-rc.d monit reload > /dev/null
            endscript
          }

    - name: Config how to monitor the resources
      ansible.builtin.copy:
        dest: /etc/monit/conf.d/CheckResources
        owner: root
        group: root
        mode: '0644'
        content: |
          check system $HOST
            if loadavg (1min) per core > 2 for 5 cycles then alert
            if loadavg (5min) per core > 1.5 for 10 cycles then alert
            if cpu usage > 95% for 10 cycles then alert
            if memory usage > 75% then alert
            if swap usage > 25% then alert
          check filesystem root with path /
            if space usage > 70% then alert
      notify: restart_monit

  handlers:
    - name: restart_monit
      ansible.builtin.systemd_service:
        name: monit
        masked: no
        enabled: true
        state: restarted

- name: proxmox repositories configuration
  tags: repositories
  hosts:
    - proxmox
  tasks:
    - name: Delete enterprise proxmox config file
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/pve-enterprise.sources

    - name: Add proxmox main repositories
      ansible.builtin.deb822_repository:
        name: proxmox
        types: deb
        uris: http://download.proxmox.com/debian/pve
        suites:
          - trixie
        components:
          - pve-no-subscription
        architectures: amd64
        signed_by: /usr/share/keyrings/proxmox-archive-keyring.gpg
        state: present

    - name: Add proxmox ceph repositories
      ansible.builtin.deb822_repository:
        name: ceph
        types: deb
        uris: http://download.proxmox.com/debian/ceph-squid
        suites:
          - trixie
        components:
          - no-subscription
        architectures: amd64
        signed_by: /usr/share/keyrings/proxmox-archive-keyring.gpg
        state: present

- name: proxmox pam pve user
  tags: user
  hosts:
    - proxmox
  tasks:
    - name: Create a proxmox PAM user Administrator
      ansible.builtin.blockinfile:
        path: /etc/pve/user.cfg
        create: yes
        block: |
          user:{{ SUDO_USER_NAME}}@pam:1:0::::::
          group:{{ SUDO_USER_NAME}}:{{ SUDO_USER_NAME}}@pam::
          acl:1:/:@{{ SUDO_USER_NAME}}:Administrator:

- name: debian server kernel security configuration
  tags: kernel
  hosts:
    - server
  tasks:
    - name: Enable reverse path filtering for new network
      ansible.posix.sysctl:
        name: net.ipv4.conf.default.rp_filter
        value: 1
        sysctl_set: yes
        state: present
        reload: yes
        sysctl_file: /etc/sysctl.d/90-kernel.conf

    - name: Enable reverse path filtering for current network
      ansible.posix.sysctl:
        name: net.ipv4.conf.all.rp_filter
        value: 1
        sysctl_set: yes
        state: present
        reload: yes
        sysctl_file: /etc/sysctl.d/90-kernel.conf

    - name: Enable Log Martian Packets on all IPv4 Interfaces
      ansible.posix.sysctl:
        name: net.ipv4.conf.all.log_martians
        value: 1
        sysctl_set: yes
        state: present
        reload: yes
        sysctl_file: /etc/sysctl.d/90-kernel.conf

    - name: Specifies the maximum number of TCP connections
      ansible.posix.sysctl:
        name: net.ipv4.tcp_max_syn_backlog
        value: 2048
        sysctl_set: yes
        state: present
        reload: yes
        sysctl_file: /etc/sysctl.d/90-kernel.conf

    - name: Number of SYN packets the Kernel will send before giving up on the new connection
      ansible.posix.sysctl:
        name: net.ipv4.tcp_synack_retries
        value: 2
        sysctl_set: yes
        state: present
        reload: yes
        sysctl_file: /etc/sysctl.d/90-kernel.conf

    - name: Cantidad de reintentos de envío del paquete SYN para establecer una nueva conexion
      ansible.posix.sysctl:
        name: net.ipv4.tcp_syn_retries
        value: 5
        sysctl_set: yes
        state: present
        reload: yes
        sysctl_file: /etc/sysctl.d/90-kernel.conf

    - name: Ignore Bogus ICMP Error Responses on IPv4 Interfaces
      ansible.posix.sysctl:
        name: net.ipv4.icmp_ignore_bogus_error_responses
        value: 1
        sysctl_set: yes
        state: present
        reload: yes
        sysctl_file: /etc/sysctl.d/90-kernel.conf

    - name: Ensure TCP SYN Cookies is enabled
      ansible.posix.sysctl:
        name: net.ipv4.tcp_syncookies
        value: 1
        sysctl_set: yes
        state: present
        reload: yes
        sysctl_file: /etc/sysctl.d/90-kernel.conf

    - name: Enables the endpoints to keep a current measurement of the round-trip time (RTT) of the network between them
      ansible.posix.sysctl:
        name: net.ipv4.tcp_timestamps
        value: 0
        sysctl_set: yes
        state: present
        reload: yes
        sysctl_file: /etc/sysctl.d/90-kernel.conf

- name: debian server e-mail notification install
  tags: notification
  hosts:
    - server
  tasks:
    - name: Install postfix, ssl-cert and bsd-mailx
      ansible.builtin.apt:
        name:
          - ssl-cert
          - postfix
          - bsd-mailx
        state: latest

    - name: Config aliases
      ansible.builtin.copy:
        dest: /etc/aliases
        owner: root
        group: root
        mode: '0644'
        content: |
          postmaster: root
          webmaster: root
          root:	{{ EMAIL_NOTIFICATION }}
      notify: restart_aliases

    - name: Setting mail name
      ansible.builtin.copy:
        dest: /etc/mailname
        owner: root
        group: root
        mode: '0644'
        content: |
          {{ ansible_fqdn }}

    - name: Config domain origin
      ansible.builtin.lineinfile:
        dest: /etc/postfix/main.cf
        regexp: "^myorigin ="
        line: 'myorigin = {{ ansible_domain }}'
      notify: restart_postfix

    - name: Config domain name
      ansible.builtin.lineinfile:
        dest: /etc/postfix/main.cf
        regexp: "^mydomain ="
        line: 'mydomain = $myorigin'
      notify: restart_postfix

    - name: Config host name
      ansible.builtin.lineinfile:
        dest: /etc/postfix/main.cf
        regexp: "^myhostname ="
        line: 'myhostname = {{ ansible_hostname }}'
      notify: restart_postfix

    - name: Config destination domains
      ansible.builtin.lineinfile:
        dest: /etc/postfix/main.cf
        regexp: "^mydestination ="
        line: 'mydestination = $myhostname.$mydomain, $myhostname.localdomain, localhost.localdomain, localhost, $myhostname'
      notify: restart_postfix

    - name: Config to listen only on localhost
      ansible.builtin.lineinfile:
        dest: /etc/postfix/main.cf
        regexp: "^inet_interfaces ="
        line: 'inet_interfaces = loopback-only'
      notify: restart_postfix

    - name: Enable postfix log
      ansible.builtin.lineinfile:
        dest: /etc/postfix/main.cf
        regexp: "^maillog_file ="
        line: 'maillog_file = /var/log/mail.log'
      notify: restart_postfix

    - name: Config postfix log rotation
      ansible.builtin.copy:
        dest: /etc/logrotate.d/postfix
        owner: root
        group: root
        mode: '0644'
        content: |
          /var/log/mail.log {
            daily
            dateext
            dateformat -%Y%m%d-%H%M%S
            missingok
            rotate 365
            compress
            su root root
            create 640 root root
            postrotate
              if [ -d /run/systemd/system ] && command systemctl >/dev/null 2>&1 && systemctl is-active --quiet postlogd.service; then
                systemctl kill --kill-who main --signal=SIGHUP postlogd.service
              else
                invoke-rc.d postfix reload > /dev/null
              fi
            endscript
          }

    - name: Fix compatibility level
      ansible.builtin.lineinfile:
        dest: /etc/postfix/main.cf
        regexp: "^compatibility_level ="
        line: 'compatibility_level = 3.6'
      notify: restart_postfix

    - name: Secure banner message
      ansible.builtin.lineinfile:
        dest: /etc/postfix/main.cf
        regexp: "^smtpd_banner ="
        line: 'smtpd_banner = $myhostname.$mydomain ESMTP'
      notify: restart_postfix

    - name: Setting certificate for TLS client connections
      ansible.builtin.lineinfile:
        dest: /etc/postfix/main.cf
        regexp: "^smtp_tls_CAfile ="
        line: 'smtp_tls_CAfile = /etc/ssl/certs/ca-certificates.crt'
      notify: restart_postfix

    - name: Enable TLS client connections
      ansible.builtin.lineinfile:
        dest: /etc/postfix/main.cf
        regexp: "^smtp_tls_security_level ="
        line: 'smtp_tls_security_level = encrypt'
      notify: restart_postfix

  handlers:
    - name: restart_aliases
      ansible.builtin.shell: |
        newaliases

    - name: restart_postfix
      ansible.builtin.systemd_service:
        name: postfix
        masked: no
        enabled: true
        state: restarted

- name: debian server upgrade unattended notification via e-mail
  tags: notification
  hosts:
    - server
  tasks:
    - name: Setting e-mail notification
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/53unattended-upgrades-notification
        owner: root
        group: root
        mode: '0644'
        content: |
          Unattended-Upgrade::Sender "{{ ansible_fqdn }}";
          Unattended-Upgrade::Mail "{{ EMAIL_NOTIFICATION }}";
          Unattended-Upgrade::MailReport "only-on-error";
      notify: restart_unattended

  handlers:
    - name: restart_unattended
      ansible.builtin.systemd_service:
        name: unattended-upgrades
        masked: no
        enabled: true
        state: restarted

- name: debian server hips notification via e-mail
  tags: notification
  hosts:
    - server
  tasks:
    - name: Setting e-mail notification destination
      ansible.builtin.lineinfile:
        dest: /etc/fail2ban/jail.local
        regexp: "^destemail ="
        line: "destemail = {{ EMAIL_NOTIFICATION }}"
      notify: restart_fail2ban

    - name: Setting e-mail notification sender
      ansible.builtin.lineinfile:
        dest: /etc/fail2ban/jail.local
        regexp: "^sender ="
        line: "sender = root@{{ ansible_fqdn }}"
      notify: restart_fail2ban

    - name: Setting MTA
      ansible.builtin.lineinfile:
        dest: /etc/fail2ban/jail.local
        regexp: "^mta = "
        line: 'mta = mail'
      notify: restart_fail2ban

    - name: Setting notification action to e-mail
      ansible.builtin.lineinfile:
        dest: /etc/fail2ban/jail.local
        regexp: "^action = %(action_)s"
        line: 'action = %(action_mwl)s'
      notify: restart_fail2ban

  handlers:
    - name: restart_fail2ban
      ansible.builtin.systemd_service:
        name: fail2ban
        masked: no
        enabled: true
        state: restarted

- name: debian server monitoring notification via e-mail
  tags: notification
  hosts:
    - server
  tasks:
    - name: Set the mail server
      ansible.builtin.lineinfile:
        dest: /etc/monit/monitrc
        regexp: "^set mailserver "
        line: 'set mailserver localhost'
      notify: restart_monit

    - name: Setting e-mail notification
      ansible.builtin.lineinfile:
        dest: /etc/monit/monitrc
        regexp: "^set alert "
        line: 'set alert {{ EMAIL_NOTIFICATION }}'
      notify: restart_monit

  handlers:
    - name: restart_monit
      ansible.builtin.systemd_service:
        name: monit
        masked: no
        enabled: true
        state: restarted

- name: debian server apache install
  tags: lamp, web
  hosts:
    - lamp
    - web
  tasks:
    - name: Install apache
      ansible.builtin.apt:
        name:
          - apache2
        state: latest

    - name: Config apache log rotation
      ansible.builtin.copy:
        dest: /etc/logrotate.d/apache2
        owner: root
        group: root
        mode: '0644'
        content: |
          /var/log/apache2/*.log
          {
            daily
            dateext
            dateformat -%Y%m%d%H%M
            missingok
            rotate 365
            compress
            create 640 root adm
            sharedscripts
            prerotate
              if [ -d /etc/logrotate.d/httpd-prerotate ]; then
                run-parts /etc/logrotate.d/httpd-prerotate
              fi
            endscript
            postrotate
              if pgrep -f ^/usr/sbin/apache2 > /dev/null; then
                invoke-rc.d apache2 reload 2>&1 | logger -t apache2.logrotate
              fi
            endscript
          }

    - name: Enable SSL module with dependencies
      ansible.builtin.file:
        src: /etc/apache2/mods-available/{{ item }}
        dest: /etc/apache2/mods-enabled/{{ item }}
        state: link
      loop:
         - rewrite.load
         - socache_shmcb.load
         - ssl.load
         - ssl.conf
      notify: restart_apache

    - name: Force HTTP redirect to HTTPS
      ansible.builtin.copy:
        dest: /etc/apache2/sites-available/000-default.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          <VirtualHost *:80>
            RewriteEngine On
            RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
          </VirtualHost>
      notify: restart_apache

    - name: Enable default SSL site
      ansible.builtin.file:
        src: /etc/apache2/sites-available/default-ssl.conf
        dest: /etc/apache2/sites-enabled/default-ssl.conf
        state: link
      notify: restart_apache

  handlers:
    - name: restart_apache
      ansible.builtin.systemd_service:
        name: apache2
        masked: no
        enabled: true
        state: restarted

- name: debian server apache security module
  tags: lamp, web
  hosts:
    - lamp
    - web
  tasks:
    - name: Install apache security module
      ansible.builtin.apt:
        name:
          - libapache2-mod-security2
        state: latest

    - name: Enable apache security module
      ansible.builtin.file:
        src: /etc/apache2/mods-available/{{ item }}
        dest: /etc/apache2/mods-enabled/{{ item }}
        state: link
      loop:
         - security2.load
         - security2.conf
      notify: restart_apache

    - name: Check if a local config file exist
      ansible.builtin.stat:
        path: /etc/modsecurity/modsecurity.conf
      register: file_check

    - name: Create a local config file
      ansible.builtin.copy:
        src: /etc/modsecurity/modsecurity.conf-recommended
        dest: /etc/modsecurity/modsecurity.conf
        remote_src: true
        owner: root
        group: root
        mode: '0644'
      when: file_check.stat.exists == false
      notify: restart_apache

    - name: Enable Rule Engine
      ansible.builtin.lineinfile:
        dest: /etc/modsecurity/modsecurity.conf
        regexp: "^SecRuleEngine"
        line: 'SecRuleEngine On'
      notify: restart_apache

    - name: Setting Tokens to Prod
      ansible.builtin.lineinfile:
        dest: /etc/apache2/conf-available/security.conf
        regexp: "^ServerTokens"
        line: 'ServerTokens Prod'
      notify: restart_apache

    - name: Disable Signature
      ansible.builtin.lineinfile:
        dest: /etc/apache2/conf-available/security.conf
        regexp: "^ServerSignature"
        line: 'ServerSignature Off'
      notify: restart_apache

    - name: Allow access request bodies
      ansible.builtin.lineinfile:
        dest: /etc/apache2/conf-available/security.conf
        regexp: "^SecRequestBodyAccess"
        line: 'SecRequestBodyAccess On'
      notify: restart_apache

    - name: Allow access response bodies
      ansible.builtin.lineinfile:
        dest: /etc/apache2/conf-available/security.conf
        regexp: "^SecResponseBodyAccess"
        line: 'SecResponseBodyAccess On'
      notify: restart_apache

    - name: Which response MIME types do you want to inspect
      ansible.builtin.lineinfile:
        dest: /etc/apache2/conf-available/security.conf
        regexp: "^SecResponseBodyMimeType"
        line: 'SecResponseBodyMimeType text/plain text/html text/xml application/octet-stream'
      notify: restart_apache

    - name: The location where ModSecurity will keep its persistent data
      ansible.builtin.lineinfile:
        dest: /etc/apache2/conf-available/security.conf
        regexp: "^SecDataDir"
        line: 'SecDataDir /tmp/'
      notify: restart_apache

    - name: Install the OWASP Core Rule Set
      ansible.builtin.apt:
        name:
          - modsecurity-crs
        state: latest
      notify: restart_apache

  handlers:
    - name: restart_apache
      ansible.builtin.systemd_service:
        name: apache2
        masked: no
        enabled: true
        state: restarted

- name: debian server apache evasive module
  tags: lamp, web
  hosts:
    - lamp
    - web
  tasks:
    - name: Install apache evasive module
      ansible.builtin.apt:
        name:
          - libapache2-mod-evasive
        state: latest

    - name: Enable evasive module
      ansible.builtin.file:
        src: /etc/apache2/mods-available/{{ item }}
        dest: /etc/apache2/mods-enabled/{{ item }}
        state: link
      loop:
         - evasive.load
         - evasive.conf
      notify: restart_apache

    - name: Setting the Track of who is accesing what
      ansible.builtin.lineinfile:
        dest: /etc/apache2/mods-available/evasive.conf
        regexp: "^    #DOSHashTableSize"
        line: '    DOSHashTableSize    3079'
      notify: restart_apache

    - name: Setting the threshold for the number of requests for the same page
      ansible.builtin.lineinfile:
        dest: /etc/apache2/mods-available/evasive.conf
        regexp: "^    #DOSPageCount"
        line: '    DOSPageCount        2'
      notify: restart_apache

    - name: Setting the threshold for the total number of requests for any object by the same client per site
      ansible.builtin.lineinfile:
        dest: /etc/apache2/mods-available/evasive.conf
        regexp: "^    #DOSSiteCount"
        line: '    DOSSiteCount        50'
      notify: restart_apache

    - name: Setting the interval used in the page count
      ansible.builtin.lineinfile:
        dest: /etc/apache2/mods-available/evasive.conf
        regexp: "^    #DOSPageInterval"
        line: '    DOSPageInterval     1'
      notify: restart_apache

    - name: Setting the interval used in the site count
      ansible.builtin.lineinfile:
        dest: /etc/apache2/mods-available/evasive.conf
        regexp: "^    #DOSSiteInterval"
        line: '    DOSSiteInterval     1'
      notify: restart_apache

    - name: Setting the amount of time (in seconds) that an IP is blocked
      ansible.builtin.lineinfile:
        dest: /etc/apache2/mods-available/evasive.conf
        regexp: "^    #DOSBlockingPeriod"
        line: '    DOSBlockingPeriod   10'
      notify: restart_apache

    - name: Creating the log directory
      ansible.builtin.file:
        path: /var/log/mod_evasive
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'

    - name: Setting the log directory location
      ansible.builtin.lineinfile:
        dest: /etc/apache2/mods-available/evasive.conf
        regexp: "^    #DOSLogDir"
        line: '    DOSLogDir           "/var/log/mod_evasive"'
      notify: restart_apache

  handlers:
    - name: restart_apache
      ansible.builtin.systemd_service:
        name: apache2
        masked: no
        enabled: true
        state: restarted

